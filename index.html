<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f5f0ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap">
<style>
/* Floating pill nav on top for wide screens, dark floating dock on phones. Poppins only.
   Each person picks a color on their own device: three inputs (--c-ink, --c-acc, --c-paper) drive every token.
   All copy lowercase; only the R in R$ stays uppercase. */
:root{
  --c-ink:#33414d; --c-acc:#ad7466; --c-paper:#f5f0ed;
  --bg:var(--c-paper); --surface:color-mix(in srgb,var(--c-paper) 25%,#fff);
  --sunk:color-mix(in srgb,var(--c-paper) 88%,var(--c-ink)); --line:color-mix(in srgb,var(--c-paper) 86%,var(--c-acc));
  --ink:var(--c-ink); --ink-2:color-mix(in srgb,var(--c-ink) 80%,var(--c-paper)); --muted:color-mix(in srgb,var(--c-ink) 52%,var(--c-paper)); --on-ink:#fffdfb;
  --rose:var(--c-acc); --rose-soft:color-mix(in srgb,var(--c-acc) 13%,var(--surface)); --rose-mid:color-mix(in srgb,var(--c-acc) 55%,var(--surface));
  --hero:var(--c-ink); --glow:color-mix(in srgb,var(--c-acc) 22%,transparent);
  /* chart series, validated for color-blind separation on this surface */
  --s1:#d0643b; --s2:#1f9a8a; --s3:#3a78c9; --s4:#d49a1a; --s5:#c9497a; --s6:#4f9a3c; --s7:#7056c2; --s8:#b8433f; --s0:#a39a94;
  --lais:#b5677e; --igor:#4d6b85; --juntos:#a68b55;
  --good:#4c7a5c; --good-soft:#e3efe6; --bad:#b4533f; --bad-soft:#f8e1da; --warn:#a2702c; --warn-soft:#f6ead6;
  --shadow:0 1px 2px rgba(30,30,30,.04),0 8px 28px rgba(30,30,30,.06);
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--c-ink) 30%,#121416); --surface:color-mix(in srgb,var(--c-ink) 34%,#1c1e21);
  --sunk:color-mix(in srgb,var(--c-ink) 30%,#16181a); --line:color-mix(in srgb,var(--c-ink) 40%,#2c2f33);
  --ink:#efe9e5; --ink-2:#cfc7c2; --muted:#a59c97; --on-ink:#16181a;
  --rose:color-mix(in srgb,var(--c-acc) 62%,#fff); --rose-soft:color-mix(in srgb,var(--c-acc) 22%,var(--surface)); --rose-mid:color-mix(in srgb,var(--c-acc) 70%,var(--surface));
  --hero:color-mix(in srgb,var(--c-ink) 70%,#0e0f10); --glow:color-mix(in srgb,var(--c-acc) 18%,transparent);
  --s1:#d4683f; --s2:#1fa08a; --s3:#4f80dd; --s4:#b8871c; --s5:#d0558a; --s6:#58a043; --s7:#8a74dc; --s8:#d85e58; --s0:#7d7570;
  --lais:#e59ab0; --igor:#8fb0cf; --juntos:#d4b67c;
  --good:#8cc29f; --good-soft:#203229; --bad:#f09a86; --bad-soft:#3d2420; --warn:#e3b86c; --warn-soft:#382d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--c-ink) 30%,#121416); --surface:color-mix(in srgb,var(--c-ink) 34%,#1c1e21);
  --sunk:color-mix(in srgb,var(--c-ink) 30%,#16181a); --line:color-mix(in srgb,var(--c-ink) 40%,#2c2f33);
  --ink:#efe9e5; --ink-2:#cfc7c2; --muted:#a59c97; --on-ink:#16181a;
  --rose:color-mix(in srgb,var(--c-acc) 62%,#fff); --rose-soft:color-mix(in srgb,var(--c-acc) 22%,var(--surface)); --rose-mid:color-mix(in srgb,var(--c-acc) 70%,var(--surface));
  --hero:color-mix(in srgb,var(--c-ink) 70%,#0e0f10); --glow:color-mix(in srgb,var(--c-acc) 18%,transparent);
  --s1:#d4683f; --s2:#1fa08a; --s3:#4f80dd; --s4:#b8871c; --s5:#d0558a; --s6:#58a043; --s7:#8a74dc; --s8:#d85e58; --s0:#7d7570;
  --lais:#e59ab0; --igor:#8fb0cf; --juntos:#d4b67c;
  --good:#8cc29f; --good-soft:#203229; --bad:#f09a86; --bad-soft:#3d2420; --warn:#e3b86c; --warn-soft:#382d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-transform:lowercase}
.brl,input,select,textarea{text-transform:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-transform:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:20px;height:20px}
.script{font-family:var(--f-script);font-style:italic;font-weight:300;color:var(--rose);letter-spacing:-.01em}
.glow{position:fixed;width:60vmax;height:60vmax;right:-18vmax;top:-12vmax;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none;z-index:-1}
h1,h2,.brand b{font-family:var(--f-display)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:.78rem;font-weight:600;letter-spacing:.14em;color:var(--rose)}
.eyebrow::before{content:"";width:28px;height:1.5px;background:var(--rose)}
.lbl{font-size:.7rem;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.brand{display:flex;align-items:center;gap:10px}
.mark img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.mark .ico.mk{width:55%;height:55%;stroke-width:1.7}
.mark.big{width:52px;height:52px;font-size:1.3rem}
.mark{width:40px;height:40px;border-radius:50%;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center;font-family:var(--f-script);font-style:italic;font-size:1.3rem;flex:none}
.brand b{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-family:var(--f-ui)}
.brand b i{font-style:normal;color:var(--rose)}
.brand small{font-size:.72rem;color:var(--muted);display:block;line-height:1}
.topnav{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;margin:12px auto 0;width:min(1180px,calc(100% - 32px));display:flex;align-items:center;gap:14px;padding:8px 8px 8px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:0 12px 40px rgba(20,20,20,.08)}
.nav{display:flex;gap:2px;margin:0 auto}
.nav a{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:.92rem;cursor:pointer;position:relative;white-space:nowrap}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nav a .badge{min-width:20px;height:20px;border-radius:99px;background:var(--c-acc);color:#fff;font-size:.7rem;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav-r{display:flex;gap:6px;align-items:center}
.main{min-width:0;padding:30px 16px 80px;display:flex;flex-direction:column;gap:18px;max-width:1180px;margin:0 auto;width:100%}
.dock{display:none}
@media (max-width:1040px){.nav a .ico{display:none}.nav a{padding:10px 12px}.brand div{display:none}}
@media (max-width:700px){
  .nav,.nav-r{display:none}
  .topnav{justify-content:center}
  .brand div{display:block}
  .topnav{padding:6px 6px 6px 8px}
  .main{padding:22px 16px calc(120px + env(safe-area-inset-bottom,0px));gap:18px}
  .dock{display:grid;grid-template-columns:repeat(2,1fr) 70px repeat(2,1fr);align-items:end;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--hero);border-radius:26px;padding:8px 6px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
  .dock a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:.6rem;font-weight:500;color:rgba(255,255,255,.62);border-radius:16px;cursor:pointer;position:relative}
  .dock a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.13)}
  .dock a .dotb{position:absolute;top:5px;right:calc(50% - 15px);width:8px;height:8px;border-radius:50%;background:var(--c-acc);box-shadow:0 0 0 2px var(--hero)}
  .dock .plus{justify-self:center;width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--c-acc);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--bg),0 10px 24px color-mix(in srgb,var(--c-acc) 55%,transparent)}
}

/* ---------- page header ---------- */
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icbtn:hover{background:var(--sunk)}
.icbtn:disabled{opacity:.3;cursor:default}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--on-ink);box-shadow:0 8px 22px rgba(51,65,77,.22)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.line:hover{background:var(--sunk)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.82rem;white-space:nowrap}
.pill-btn:hover{border-color:var(--rose-mid)}
.pill-btn.rose{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.link{color:var(--rose);font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:4px}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;min-width:0}
@media (max-width:700px){.card{padding:18px 16px}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:1.1rem;font-weight:600;letter-spacing:-.01em}
.alert{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:16px;border:1px solid var(--line);background:var(--rose-soft);color:var(--rose);font-size:.92rem;flex-wrap:wrap}
.alert b{font-weight:600}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:900px){.grid-2e{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* month sheet: the spreadsheet, made friendlier */
.mhead{display:flex;align-items:center;gap:4px;margin-left:-8px}
.mhead h1{margin:0;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;letter-spacing:-.035em;line-height:1}
.mhead h1 .script{font-size:1em}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.sum3 div{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum3 div+div{border-left:1px solid var(--line)}
.sum3 span{font-size:.78rem;color:var(--muted)}
.sum3 b{font-family:var(--f-num);font-size:clamp(1rem,3.4vw,1.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
@media (max-width:520px){.sum3 div{padding:12px 10px}.sum3 b .brl{display:none}}
.sum3 b.neg{color:var(--bad)}.sum3 b.pos{color:var(--good)}
.qadd{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid color-mix(in srgb,var(--c-acc) 30%,transparent)}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qadd input,.qadd select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;min-width:0}
.qadd #q-desc{flex:1 1 180px}
.qadd #q-valor{flex:0 0 120px;font-weight:600}
.qadd #q-data{flex:0 0 150px}
.qadd .btn{height:44px}
.qadd .hint{flex-basis:100%}
.chipset{display:inline-flex;gap:4px;padding:3px;border-radius:999px;background:var(--sunk)}
.chipset button{padding:6px 12px;border-radius:999px;font-size:.84rem;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chipset button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
@media (max-width:520px){.qadd #q-valor{flex:1 1 100px}.qadd #q-data{flex:1 1 130px}.qadd .btn{flex:1 1 100%;justify-content:center}}
.sec{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 16px 12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0 8px;border-bottom:1.5px solid var(--ink)}
.sec-h h2{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.sec-h span{font-size:.84rem;color:var(--muted)}
.sec-h b{font-weight:600;color:var(--ink)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ln.ck{grid-template-columns:28px minmax(0,1fr) auto}
.ln:last-child{border-bottom:0}
.ln b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln small{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ln .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .v.in{color:var(--good)}
.ln.paid b,.ln.paid .v{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ln .tap{display:contents;cursor:pointer}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--rose-mid);display:grid;place-items:center;color:#fff}
.box.on{background:var(--good);border-color:var(--good)}
.late{color:var(--bad)!important}
.more{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.empty-ln{padding:14px 0;color:var(--muted);font-size:.88rem}
.greet{margin:0 0 -6px;font-size:1.05rem;color:var(--ink-2)}
.greet .script{font-size:1em}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--on-ink);padding:8px 11px;border-radius:10px;font-size:.78rem;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:220px;transform:translate(-50%,calc(-100% - 12px))}
.tip b{font-weight:600}
[data-tip]{cursor:pointer}
.viz text{fill:var(--muted);font-family:var(--f-ui);font-size:11px}
@media (max-width:699px){.viz text{font-size:12px}}
.chart .viz,.chart svg{max-width:100%}
.viz .hit .guide{opacity:0}.viz .hit:hover .guide,.viz .hit.on .guide{opacity:1}
.viz .bar-m{transition:opacity .15s}.viz:hover .bar-m{opacity:.55}.viz .bar-m:hover{opacity:1}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.donut{grid-template-columns:minmax(0,1fr);gap:12px}.donut svg{max-width:170px;margin:0 auto}}
.donut svg{width:100%;height:auto;display:block}
.dleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.dleg button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:6px;border-radius:10px;font-size:.84rem}
.dleg button:hover{background:var(--sunk)}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.headline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:-4px 0 10px;font-size:.86rem;color:var(--muted)}
.headline b{font-size:1.1rem;color:var(--ink);font-weight:600;letter-spacing:-.02em}
.pill-delta{font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px}
.pill-delta.up{background:var(--bad-soft);color:var(--bad)}.pill-delta.down{background:var(--good-soft);color:var(--good)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:400px;margin:0 auto}
.cal .wd{font-size:.68rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.7rem;color:var(--ink-2);max-width:100%}
.cal .d.hot{color:#fff}
.cal .d.today{outline:1.5px solid var(--ink);outline-offset:1px}
.scale{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:.72rem;color:var(--muted)}
.scale i{width:14px;height:10px;border-radius:3px}
.ym-link{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px}
.ym-link>.ico{width:40px;height:40px;padding:10px;border-radius:12px;background:var(--rose-soft);color:var(--rose)}
.ym-link b{display:block;font-weight:600}.ym-link small{color:var(--muted);font-size:.8rem}
.bankhero{display:flex;align-items:center;gap:14px}
.bankhero h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.bankhero span{color:var(--muted);font-size:.84rem}
.bm.big{width:56px;height:56px;border-radius:16px;font-size:1.05rem;background:var(--bk);color:#fff;display:grid;place-items:center;font-weight:700}
.pbar{display:block;height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px;max-width:220px}.pbar i{display:block;height:100%;border-radius:99px}
.ym{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.ym:last-of-type{border-bottom:0}
.ym:hover{background:var(--sunk)}
.ym-n{font-weight:500}
.ym-b{display:flex;flex-direction:column;gap:3px}
.ym-b i{display:block;height:6px;border-radius:0 4px 4px 0;min-width:2px}
.ym-v{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.ym-v.neg{color:var(--bad)}.ym-v.pos{color:var(--good)}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.dash.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:899px){.dash,.dash.wide{grid-template-columns:minmax(0,1fr)}}
.ltabs2{display:flex;width:100%;border-radius:16px}
.ltabs2 button{flex:1;flex-direction:column;gap:0;justify-content:center;padding:8px 6px;border-radius:13px}
.ltabs2 small{font-size:.7rem;color:var(--muted);font-weight:500;white-space:nowrap}
.qadd select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px;flex:1 1 140px;min-width:0}
.catchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.catchips::-webkit-scrollbar{display:none}
.catchips .chip{flex:none}
.bk-dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}

// and so do the other installments of the same purchases (earlier and later months), unless a card was already chosen.
const ROXO_NUBANK=[['2026-08','juntos','cama 4/12'],['2026-08','juntos','rihappy 2/3'],['2026-08','igor','perfume 1/2'],['2026-08','lais','crocs 1/4'],
  ['2026-09','juntos','cama 5/12'],['2026-09','juntos','rihappy 3/3'],['2026-09','igor','perfume 2/2'],['2026-09','lais','crocs 2/4'],['2026-09','juntos','assinaturas'],['2026-09','igor','boné 1/2'],['2026-09','juntos','adidas 2/2'],
  ['2026-10','juntos','lanche'],['2026-10','juntos','cama 6/12'],['2026-10','lais','crocs 3/4'],['2026-10','juntos','assinaturas'],['2026-10','igor','boné 2/2']];
async function migrarRoxo(){

  for(const [,q,d] of ROXO_NUBANK){ const p=parc(d); if(p) serie.add(q+'|'+p.base.toLowerCase()+'|'+p.y); else if(d==='assinaturas') fixa.add(q+'|'+d); }

    return exato.has(i.mes+'|'+i.quem+'|'+d)||(p&&serie.has(i.quem+'|'+p.base.toLowerCase()+'|'+p.y))||(fixa.has(i.quem+'|'+d)&&i.mes>='2026-09'); });

// a monthly limit per category (or for all day-to-day spending), shared by the two of them: {tipo:'meta', cat, valor}
const TOTAL='todos os gastos';
const METACATS=[TOTAL,...CATN.filter(c=>c!=='cartões')];
const metas=()=>{ const o={}; for(const i of items.values()) if(i.tipo==='meta'&&!i.removido&&+i.valor>0) o[i.cat]=+i.valor; return o; };
const gastoCat=(m,c)=>sum(ofMes(m,'gasto').filter(g=>c===TOTAL||cat(g)===c));
const media3=(m,c)=>{ const ms=[1,2,3].map(k=>addM(m,-k)).filter(x=>ofMes(x,'gasto').length); return ms.length?ms.reduce((s,x)=>s+gastoCat(x,c),0)/ms.length:0; };
function metaInfo(m,c,lim){
  const g=gastoCat(m,c), t=today(), dim=new Date(+m.slice(0,4),+m.slice(5),0).getDate();
  const cur=m===t.slice(0,7), dia=cur?+t.slice(8):dim, prev=cur&&dia>=10?g/dia*dim:g;
  const p=g/lim; return {g,p,prev,nivel:p>=1?'bad':p>=.8||(cur&&prev>lim*1.05)?'warn':'good',resta:lim-g};
}
function cardMetas(m){

function pAno(){
  const years=[...new Set(meses().map(m=>m.slice(0,4)))]; const Y=years.includes(ui.ano)?ui.ano:years.at(-1); const cm=today().slice(0,7);
  const rows=MESES.map((n,i)=>{const m=`${Y}-${pad(i+1)}`;const r=resumo(m);return {m,n,...r,any:(index().byMes.get(m)||[]).length>0}}).filter(r=>r.any&&r.m<=cm);
  const E=rows.reduce((s,r)=>s+r.E,0),C=rows.reduce((s,r)=>s+r.C,0),G=rows.reduce((s,r)=>s+r.G,0), S=E-C-G;
  const yr=live().filter(i=>i.mes.startsWith(Y)&&i.mes<=cm);
  let h=`<div class="mhead" style="justify-content:space-between;margin-left:0"><h1 style="margin:0;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;letter-spacing:-.035em">${Y}</h1>
    <div class="chipset">${years.map(y=>`<button data-ano="${y}" aria-pressed="${y===Y}">${y}</button>`).join('')}</div></div>`;
  if(!rows.length) return h+`<section class="card empty">${ic('chart')}<div>${Y} ainda não tem lançamentos até hoje.</div></section>`;
  h+=sum3([['entrou',fmt(E)],['saiu',fmt(C+G)],[S<0?'faltou':'sobrou',fmt(Math.abs(S)),S<0?'neg':'pos']]);
  h+=`<section class="card"><div class="card-h"><h2>entrou e saiu</h2></div>${chartN(null,0,rows.map(r=>r.m))}</section>`;
  const mx=Math.max(...rows.map(r=>Math.max(r.E,r.C+r.G)),1);
  h+=`<section class="sec"><div class="sec-h"><h2>mês a mês</h2><span>toque para abrir</span></div>${rows.slice().reverse().map(r=>`<button class="ym" data-goto="${r.m}">
      <span class="ym-n">${r.n}</span>
      <span class="ym-b"><i style="width:${r.E/mx*100}%;background:var(--ink)"></i><i style="width:${(r.C+r.G)/mx*100}%;background:var(--rose-mid)"></i></span>
      <span class="ym-v ${r.S<0?'neg':'pos'}">${r.S<0?'−':'+'}${fmt(Math.abs(r.S))}</span></button>`).join('')}
    <div class="legend" style="margin-top:12px"><span><i class="sw" style="background:var(--ink)"></i>entrou</span><span><i class="sw" style="background:var(--rose-mid)"></i>saiu</span><span>à direita: quanto sobrou</span></div></section>`;
  h+=chartAcumulado(Y);
  h+=`<button class="sec ym-link" data-banco="">${ic('card')}<span><b>bancos e cartões</b><small>quanto foi em cada cartão, parcelas e histórico</small></span>${ic('right','sm')}</button>`;
  h+=`<div class="dash">${cardCats(yr.filter(i=>i.tipo==='gasto'),'para onde foi no ano')}${cardQuem(null,yr.filter(i=>i.tipo!=='entrada'))}</div>`;
  return h;
}

// The couple's history ships encrypted (dados.enc.json, AES-GCM). The key lives in the 'segredos' table, readable
// only by the two members, so the public repo never holds readable numbers. First login into an empty table uploads it.
async function seedInicial(){
  const f=(window.FIN_CONFIG||{}).dadosIniciais; if(!f||!crypto?.subtle) return;
  const k=await sb.from('segredos').select('valor').eq('nome','chave_historico').maybeSingle(); const chave=k.data?.valor; if(!chave) return;
  try{
    const r=await fetch(f,{cache:'no-store'}); if(!r.ok) return; const e=await r.json();
    const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(chave),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const arr=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.data))));
    bannerMsg=''; toast(`trazendo ${arr.length} lançamentos…`,'upload');
    await store.bulk(arr); toast(`${arr.length} lançamentos prontos`);
  }catch(err){ bannerMsg='não consegui trazer o histórico. em ajustes, use importar backup.'; }
}

async function saveFile(name,data,type){

  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('não consegui gerar o arquivo.','alert'); }
}

}
async function doLogin(){
  const email=$('#l-email').value.trim().toLowerCase(), pass=$('#l-pass').value; const err=t=>{const e=$('#l-err');e.textContent=t;e.hidden=false};
  if(!email||!pass) return err('preencha email e senha.');
  const btn=$('#loginF button[type=submit]'); btn.disabled=true; btn.textContent='entrando…';
  let r=await sb.auth.signInWithPassword({email,password:pass});
  // first time: no account yet for this email, so create it with the password just typed
  if(r.error&&/invalid login/i.test(r.error.message||'')){
    if(pass.length<6){ btn.disabled=false; btn.innerHTML=`${ic('lock','sm')} entrar`; return err('senha incorreta. se for o primeiro acesso, use pelo menos 6 caracteres.'); }
    const u=await sb.auth.signUp({email,password:pass});

  }
  btn.disabled=false; btn.innerHTML=`${ic('lock','sm')} entrar`;
  if(r.error){ const m=r.error.message||''; return err(/invalid login/i.test(m)?'senha incorreta.':/not confirmed/i.test(m)?'no supabase, desligue "confirm email" e tente de novo.':'não deu certo: '+m.toLowerCase()); }

}

async function repetirFixas(){
  const m=ui.mes, nx=addM(m,1); const ex=new Set(ofMes(nx,'conta').map(c=>c.quem+'|'+baseOf(c))); let n=0;
  for(const c of ofMes(m,'conta')){ if(parc(c.desc)) continue; const k=c.quem+'|'+baseOf(c); if(ex.has(k)) continue;
    const it={id:uid(),tipo:'conta',quem:c.quem,desc:c.desc,valor:c.valor,data:c.data?addMd(c.data,1):`${nx}-10`,mes:nx,pago:false}; if(c.banco!==undefined) it.banco=c.banco;
    await safe(store.put(it)); n++; }
  toast(n?`${n} conta${n>1?'s fixas repetidas':' fixa repetida'} em ${mName(nx)}`:`${mName(nx)} já tem essas contas`, n?'repeat':'check');
}
async function exportCsv(){
  const rows=[['tipo','mes','data','quem','descricao','categoria','banco','valor','pago','ja pago em parte']].concat([...live()].sort((a,b)=>(a.mes+(a.data||'')).localeCompare(b.mes+(b.data||''))).map(i=>[i.tipo,i.mes,i.data||'',QUEM[i.quem]||i.quem,i.desc,i.tipo==='gasto'?cat(i):'',i.tipo==='conta'?(banco(i)||''):'',String(i.valor).replace('.',','),i.tipo==='conta'?(i.pago?'sim':'não'):'',pagoParte(i)?String(pagoParte(i)).replace('.',','):'']));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  saveFile(`financeiro-${today()}.csv`,csv,'text/csv');
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-addrow],[data-jump],[data-bankrestore],[data-banco],[data-fotodel],[data-fotoaj],[data-cropok],[data-cropclose],[data-lt],[data-icone],[data-undo],[data-mesjump],[data-pickmes],[data-qt],[data-qq],[data-bankadd],[data-bankdel],[data-setmes],[data-tema],[data-sair],[data-export],[data-impok],[data-impcancel],[data-page],[data-mstep],[data-pagar],[data-edit],[data-new],[data-cat],[data-ano],[data-goto],[data-copiar],[data-csv],[data-close],[data-ft],[data-fq],[data-addparc],[data-delparc],[data-askdel],[data-del]');
  if(!t) return;
  const d=t.dataset;
  if(d.icone){ setIcone({id:d.icone}); toast('ícone salvo'); return; }
  if(d.banco!==undefined){ if(d.banco) ui.bk=d.banco; ui.page='bancos'; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(d.fotodel){ foto=null; try{localStorage.removeItem('fin-foto');localStorage.removeItem('fin-foto-orig')}catch(e){} setIcone({usaFoto:false}); toast('foto removida'); return; }
  if(d.fotoaj){ let o=null; try{o=localStorage.getItem('fin-foto-orig')}catch(_){} abrirFoto(o||foto); return; }
  if(d.cropok){ foto=cropSalvar(); crop=null; $('#sheetHost').innerHTML=''; try{localStorage.setItem('fin-foto',foto)}catch(_){} setIcone({usaFoto:true}); toast('foto de perfil salva'); return; }
  if(d.cropclose){ if(e.target===t||t.tagName==='BUTTON'){ crop=null; $('#sheetHost').innerHTML=''; } return; }
  if(d.mesjump){ openMesJump(); return; }
  if(d.pickmes){ ui.mes=d.pickmes; $('#sheetHost').innerHTML=''; render(); window.scrollTo({top:0}); return; }
  if(d.qt){ if($('#sF')){ const k=keepVals('s'); openQuick(d.qt); putVals('s',k); } else { ui.qtipo=d.qt; ui.lt={conta:'contas',gasto:'gastos',entrada:'entradas'}[d.qt]; ui.cat=null; render(); } return; }
  if(d.addrow!==undefined){ ui.add=d.addrow||null; render(); if(ui.add) setTimeout(()=>$('#'+PFX[ui.add]+'-desc')?.focus(),50); return; }
  if(d.jump){ $('#'+d.jump)?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(d.lt){ ui.lt=d.lt; ui.cat=null; ui.qtipo={contas:'conta',gastos:'gasto',entradas:'entrada'}[d.lt]; render(); return; }
  if(d.qq){ ui.qquem=d.qq; if($('#sF')){ const k=keepVals('s'); openQuick(ui.qtipo); putVals('s',k); } else render(); return; }
  if(d.bankadd){ const n=($('#bk-nome').value||'').trim().toLowerCase(); if(!n){ toast('escreva o nome do banco.','alert'); return; }
    safe(store.put({...(items.get('banco_'+slug(n))||{}),id:'banco_'+slug(n),tipo:'banco',nome:n,cor:$('#bk-cor').value,oculto:false}),`${n} adicionado`); return; }
  if(d.bankdel){ const n=d.bankdel, id='banco_'+slug(n);
    safe(store.put({...(items.get(id)||{}),id,tipo:'banco',nome:n,oculto:true}),`${n} saiu da lista`);
    return; }
  if(d.bankrestore){ for(const b of bankDocs().filter(b=>b.oculto)) safe(store.patch(b.id,{oculto:false})); toast('bancos de volta'); return; }
  if(d.tema){ const t=TEMAS.find(x=>x[0]===d.tema); if(t){ setTema({id:t[0],...t[2]}); toast('cor salva'); } return; }
  if(d.sair){ ['fin-foto','fin-foto-orig','fin-icone','fin-tema','fin-pend'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}}); foto=null; icone={id:'wallet'}; outbox=[]; applyTema({id:'plane',...TEMAS[0][2]}); applyIcone(); sb?.auth.signOut(); return; }
  if(d.export){ exportJson(); return; }
  if(d.impok){ doImport(); return; }
  if(d.impcancel){ importPend=null; render(); return; }
  if(d.close!==undefined){ if(e.target===t||t.tagName==='BUTTON'){form=null;drawSheet();} return; }
  if(d.goto&&ui.busca){ ui.busca=''; }
  if(d.page){ ui.page=d.page; ui.cat=null; ui.busca=''; saveUi(); render(); if(d.metas) $('#metas')?.scrollIntoView({block:'start'}); else window.scrollTo({top:0}); return; }
  if(d.mstep){ ui.mes=addM(ui.mes,+d.mstep); render(); return; }
  if(d.goto){ ui.mes=d.goto; ui.page='lanc'; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(d.pagar){ if(!canWrite) return; const it=items.get(d.pagar); if(it) safe(store.patch(it.id,{pago:!it.pago}), it.pago?'voltou para a pagar':'conta paga'); return; }
  if(d.edit){ if(!canWrite) return; const it=items.get(d.edit); if(it) openSheet(it); return; }
  if(d.new){ openQuick(d.new==='auto'?({contas:'conta',entradas:'entrada'}[ui.lt]||'gasto'):d.new); return; }
  if(d.cat!==undefined){ ui.cat=d.cat||null; const ir=ui.page!=='lanc'; ui.page='lanc'; saveUi(); render(); if(ir||ui.cat) $('#sec-gasto')?.scrollIntoView({block:'start'}); return; }
  if(d.ano){ ui.ano=d.ano; render(); return; }
  if(d.copiar){ repetirFixas(); return; }
  if(d.csv){ exportCsv(); return; }
  if(d.ft){ readForm(); form.tipo=d.ft; if(form.tipo==='entrada'&&form.quem==='juntos') form.quem='lais'; if(d.ft==='conta'&&form.pago===undefined) form.pago=false; drawSheet(); return; }
  if(d.fq){ readForm(); form.quem=d.fq; drawSheet(); return; }
  if(d.addparc){ readForm(); const v=parseV($('#f-pv').value); if(!(v>0)){ const e=$('#f-err'); e.textContent='digite quanto pagou agora, por exemplo 300.'; e.hidden=false; return; }
    form.parciais=[...(form.parciais||[]),{v,d:today()}]; const tot=parseV(form.valor); if(isFinite(tot)&&form.parciais.reduce((s,p)=>s+p.v,0)>=tot-0.004) form.pago=true; drawSheet(); return; }
  if(d.delparc!==undefined){ readForm(); form.parciais=(form.parciais||[]).filter((_,i)=>i!==+d.delparc); drawSheet(); return; }
  if(d.askdel){ readForm(); form.confirm=true; drawSheet(); return; }
  if(d.del){ const id=form.id, old=items.get(id); form=null; drawSheet(); if(!old) return;
    const soft=old.auto||(old.tipo==='conta'&&parc(old.desc));
    safe(soft?store.patch(id,{removido:true}):store.del(id)).then(()=>toast('excluído','trash',{undo:()=>{ const {removido,...back}=old; return safe(store.put(back),'voltou'); }})); return; }
  if(d.undo){ const f=toast.undo; toast.undo=null; $('#toastHost').innerHTML=''; f?.(); return; }
});
document.addEventListener('change',async e=>{ if(e.target.id==='fotoFile'&&e.target.files[0]){ try{ const o=await lerOriginal(e.target.files[0]); try{localStorage.setItem('fin-foto-orig',o)}catch(_){} abrirFoto(o); }catch(_){ toast('não consegui abrir essa foto.','alert'); } e.target.value=''; return; } if(e.target.dataset?.meta!==undefined){ const c=e.target.dataset.meta, id='meta_'+slug(c), raw=e.target.value.trim(), v=parseV(raw);
    if(!raw||!(v>0)){ if(items.has(id)) safe(store.del(id),`meta de ${c} tirada`); return; }
    safe(store.put({id,tipo:'meta',cat:c,valor:v}),`meta de ${c}: ${fmtT(v)} por mês`); return; } if(e.target.dataset?.bankcor){ const n=e.target.dataset.bankcor; const id='banco_'+slug(n); safe(store.put({...(items.get(id)||{}),id,tipo:'banco',nome:n,cor:e.target.value}),'cor do banco salva'); return; } if(e.target.id==='impFile'&&e.target.files[0]) readImport(e.target.files[0]); if(e.target.id==='temaCor'){ setTema(temaCustom(e.target.value)); toast('cor salva'); } });
document.addEventListener('submit',e=>{ if(e.target.id==='sheet'){e.preventDefault();submit();} if(e.target.id==='loginF'){e.preventDefault();doLogin();} const qm=/^(q|s|ae|ac|ag)F$/.exec(e.target.id); if(qm){e.preventDefault();quickAdd(qm[1]);} });
document.addEventListener('input',e=>{
  if(e.target.id==='temaCor'){ applyTema(temaCustom(e.target.value)); return; }
  if(e.target.id==='cropZ'&&crop){ const z=+e.target.value, r=z/crop.z; crop.x*=r; crop.y*=r; crop.z=z; cropPaint(); return; }
  if(e.target.id==='bk-cor'){ $('#bk-sw').style.background=e.target.value; return; }
  if(/^(q|s|ae|ac|ag)-desc$/.test(e.target.id)){ const p=e.target.id.split('-')[0], d=e.target.value; const ch=$('#'+p+'-cathint'); if(ch) ch.innerHTML=d.trim()?`categoria: <b>${esc(cat({desc:d}))}</b> · dá para trocar depois tocando no gasto`:'a categoria é identificada sozinha pelo que você escrever.'; const b=$('#'+p+'-bank'); if(b){ const k=banco({tipo:'conta',desc:d}); b.value=k||''; } }
  if(e.target.id==='q-busca'){ ui.busca=e.target.value; clearTimeout(window._bq); window._bq=setTimeout(render,120); return; }
  if(e.target.id==='f-desc'){ if($('#f-cat')) $('#f-cat').value=cat({desc:e.target.value}); if($('#f-bank')&&form&&form.bankSel===undefined&&form.banco===undefined){ const b=banco({tipo:'conta',desc:e.target.value}); $('#f-bank').value=b||''; } }
});
let rz; let lastW=window.innerWidth; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(lastW-window.innerWidth)>40){lastW=window.innerWidth;render();}},200)});
const tipEl=()=>$('#tip');
function showTip(el,x,y){ const t=tipEl(); t.innerHTML=el.dataset.tip.split('|').join('<br>'); t.hidden=false; const w=t.offsetWidth; t.style.left=Math.min(Math.max(x,w/2+8),innerWidth-w/2-8)+'px'; t.style.top=Math.max(y,t.offsetHeight+20)+'px'; }
document.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; const el=e.target.closest?.('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else if(!tipEl().hidden) tipEl().hidden=true; });
document.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; const el=e.target.closest?.('[data-tip]'); document.querySelectorAll('.hit.on').forEach(h=>h.classList.remove('on')); if(el){ showTip(el,e.clientX,e.clientY); el.classList.add('on'); } else tipEl().hidden=true; });
addEventListener('scroll',()=>{ if(!tipEl().hidden) tipEl().hidden=true; },{passive:true});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='f-pv'){ e.preventDefault(); $('[data-addparc]')?.click(); return; } if(e.key==='Enter'&&/^(q|s|ae|ac|ag)-desc$/.test(e.target.id)&&!$('#'+e.target.id.split('-')[0]+'-valor').value){ e.preventDefault(); $('#'+e.target.id.split('-')[0]+'-valor').focus(); return; } if(e.key==='Escape'){ if(form){form=null;drawSheet();} else { crop=null; $('#sheetHost').innerHTML=''; } } });

// phones keep the app suspended for hours: when it comes back, catch up with what the other one changed
// and, if the month turned meanwhile, move to the new month and carry the installments
let hiddenAt=0, dia=today();
async function voltar(){
  const t=today(); if(t!==dia){ if(ui.mes===dia.slice(0,7)) ui.mes=t.slice(0,7); dia=t; autoDone=false; }
  if(mode==='nuvem'&&session&&!gate){ await flush(); await loadAll(); }
  render(); if(!autoDone) setTimeout(autoParcelas,300);
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') hiddenAt=Date.now(); else if(Date.now()-hiddenAt>45000||today()!==dia) voltar(); });
addEventListener('online',()=>flush());

// dragging the photo inside the frame (mouse or finger)
let drag=null;
document.addEventListener('pointerdown',e=>{ if(!crop||!e.target.closest?.('#cropBox')) return; e.preventDefault(); drag={x:e.clientX,y:e.clientY,ox:crop.x,oy:crop.y}; try{$('#cropBox').setPointerCapture(e.pointerId)}catch(_){} });
document.addEventListener('pointermove',e=>{ if(!drag||!crop) return; crop.x=drag.ox+e.clientX-drag.x; crop.y=drag.oy+e.clientY-drag.y; cropPaint(); });
document.addEventListener('pointerup',()=>{ drag=null; }); document.addEventListener('pointercancel',()=>{ drag=null; });

// iphone safari ignores user-scalable=no for pinch, so the pinch gesture is blocked here
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));

// new version: a bar with "atualizar" shows up; one tap switches to it and reloads
if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude && /github\.io$|localhost/.test(location.hostname)){
  const avisar=w=>{ if(!w||!navigator.serviceWorker.controller) return; $('#updHost').innerHTML=`<div class="upd">${ic('repeat','sm')}<span>nova versão do app</span><button data-atualizar="1">atualizar</button></div>`; avisar.w=w; };
  navigator.serviceWorker.register('sw.js').then(reg=>{
    avisar(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w?.addEventListener('statechange',()=>{ if(w.state==='installed') avisar(w); }); });
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{});
  let recarregou=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(recarregou) return; recarregou=true; location.reload(); });
  document.addEventListener('click',e=>{ if(!e.target.closest('[data-atualizar]')) return; const b=e.target.closest('[data-atualizar]'); b.textContent='atualizando…'; b.disabled=true;
    if(avisar.w) avisar.w.postMessage('atualizar'); else location.reload(); setTimeout(()=>location.reload(),4000); });
}
