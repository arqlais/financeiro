<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap">
<style>
/* financeiro · laís & igor — a spreadsheet you want to open.
   one ink (plum), one accent (violet) and three soft blocks (lilac, lime, pink) that each mean one thing:
   lilac = contas, lime = entrou, pink = saiu. numbers always right-aligned, same size, same weight.
   each person can still pick a color: --c-ink, --c-acc, --c-paper drive everything.
   all copy lowercase; only the R in R$ stays uppercase. */
:root{
  --c-ink:#241b35; --c-acc:#7b5ce0; --c-paper:#f4f2ee;
  --bg:var(--c-paper); --surface:#fff; --sunk:color-mix(in srgb,var(--c-paper) 70%,var(--c-ink) 6%);
  --line:color-mix(in srgb,var(--c-ink) 9%,#fff); --bd:color-mix(in srgb,var(--c-ink) 10%,#fff);
  --ink:var(--c-ink); --ink-2:color-mix(in srgb,var(--c-ink) 78%,#fff); --muted:color-mix(in srgb,var(--c-ink) 52%,#fff); --on-ink:#fff;
  --rose:var(--c-acc); --rose-soft:color-mix(in srgb,var(--c-acc) 12%,#fff); --rose-mid:color-mix(in srgb,var(--c-acc) 45%,#fff);
  --hero:var(--c-ink);
  --lilac:#cdbdf5; --lime:#dcef7c; --pink:#f6bfd8; --sky:#cfe0f5; --t-txt:color-mix(in srgb,var(--c-ink) 88%,#000);
  --s1:#d0643b; --s2:#1f9a8a; --s3:#3a78c9; --s4:#d49a1a; --s5:#c9497a; --s6:#4f9a3c; --s7:#7056c2; --s8:#b8433f; --s0:#a39fae;
  --lais:#c7588a; --igor:#4d6fa3; --juntos:#a58a3e;
  --good:#3f8a5a; --good-soft:#e2f2e7; --bad:#c2454f; --bad-soft:#fbe4e6; --warn:#a2702c; --warn-soft:#f6ead6;
  --shadow:0 1px 2px rgba(36,27,53,.04),0 8px 24px rgba(36,27,53,.06);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--c-ink) 40%,#0e0d12); --surface:color-mix(in srgb,var(--c-ink) 45%,#17151d); --sunk:color-mix(in srgb,var(--c-ink) 40%,#121016);
  --line:rgba(255,255,255,.08); --bd:rgba(255,255,255,.09);
  --ink:#f3f0f8; --ink-2:#d6d1e0; --muted:#a19bb0; --on-ink:#16131d;
  --rose:color-mix(in srgb,var(--c-acc) 55%,#fff); --rose-soft:color-mix(in srgb,var(--c-acc) 22%,#17151d); --rose-mid:color-mix(in srgb,var(--c-acc) 65%,#17151d);
  --hero:color-mix(in srgb,var(--c-ink) 55%,#000);
  --lais:#ec8fb8; --igor:#8fb0e0; --juntos:#d7bd78;
  --good:#7fd19c; --good-soft:#1d3226; --bad:#f08a92; --bad-soft:#3b1f24; --warn:#e3b86c; --warn-soft:#382d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--c-ink) 40%,#0e0d12); --surface:color-mix(in srgb,var(--c-ink) 45%,#17151d); --sunk:color-mix(in srgb,var(--c-ink) 40%,#121016);
  --line:rgba(255,255,255,.08); --bd:rgba(255,255,255,.09);
  --ink:#f3f0f8; --ink-2:#d6d1e0; --muted:#a19bb0; --on-ink:#16131d;
  --rose:color-mix(in srgb,var(--c-acc) 55%,#fff); --rose-soft:color-mix(in srgb,var(--c-acc) 22%,#17151d); --rose-mid:color-mix(in srgb,var(--c-acc) 65%,#17151d);
  --hero:color-mix(in srgb,var(--c-ink) 55%,#000);
  --lais:#ec8fb8; --igor:#8fb0e0; --juntos:#d7bd78;
  --good:#7fd19c; --good-soft:#1d3226; --bad:#f08a92; --bad-soft:#3b1f24; --warn:#e3b86c; --warn-soft:#382d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;overscroll-behavior-x:none}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;text-transform:lowercase;-webkit-tap-highlight-color:transparent}
.brl,input,select,textarea,::placeholder{text-transform:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-transform:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:21px;height:21px}
.script{font-style:italic;font-weight:700;color:var(--rose);letter-spacing:-.02em}
h1,h2{margin:0;font-weight:600;letter-spacing:-.02em}
.lbl{font-size:.7rem;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.lais{background:var(--lais)}.dot.igor{background:var(--igor)}.dot.juntos{background:var(--juntos)}
.bk-dot{display:inline-block;width:8px;height:8px;border-radius:3px;flex:none}
.late{color:var(--bad)!important;font-weight:500}
@media (max-width:899px){input,select,textarea{font-size:16px!important}}

/* ---------- shell ---------- */
.mark{width:46px;height:46px;border-radius:50%;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.mark .ico.mk{width:52%;height:52%}
.mark.big{width:54px;height:54px}
.topnav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;margin:10px auto 0;width:min(1180px,calc(100% - 32px));display:flex;align-items:center;gap:14px;padding:7px 8px 7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--bd);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;text-align:left}
.brand .mark{width:38px;height:38px}
.brand small{display:block;font-size:.72rem;color:var(--muted);line-height:1}
.brand b{display:block;font-size:1.05rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.brand b i{font-style:normal;color:var(--rose)}
.nav{display:flex;gap:2px;margin:0 auto}
.nav a{padding:9px 16px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:.92rem;cursor:pointer}
.nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nav a .badge{margin-left:6px;min-width:18px;height:18px;border-radius:99px;background:var(--c-acc);color:#fff;font-size:.68rem;font-weight:600;display:inline-grid;place-items:center;padding:0 5px}
.nav-r{display:flex;gap:6px;align-items:center}
.main{min-width:0;max-width:1180px;margin:0 auto;width:100%;padding:26px 16px 80px;display:flex;flex-direction:column;gap:16px}
.dock,.appbar{display:none}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--bd);color:var(--ink);flex:none}
.rbtn.dark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
@media (max-width:700px){
  .topnav{display:none}
  .appbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;max-width:1180px;margin:0 auto}
  .appbar .who{flex:1;min-width:0;line-height:1.2}
  .appbar .who small{display:block;font-size:.78rem;color:var(--muted)}
  .appbar .who b{display:block;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px));gap:14px}
  /* dark pill dock: the open page shows as a white capsule with its name */
  .dock{display:flex;align-items:center;justify-content:space-between;gap:4px;position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--hero);border-radius:999px;padding:7px;box-shadow:0 14px 34px rgba(20,24,28,.28)}
  .dock a{height:50px;min-width:50px;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;color:rgba(255,255,255,.62);cursor:pointer;position:relative;font-size:.8rem;font-weight:600}
  .dock a span{display:none}
  .dock a[aria-current="page"]{background:#fff;color:var(--c-ink);padding:0 16px}
  .dock a[aria-current="page"] span{display:inline}
  .dock a .dotb{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--c-acc);box-shadow:0 0 0 2px var(--hero)}
  .dock a[aria-current="page"] .dotb{box-shadow:0 0 0 2px #fff}
  .dock .plus{width:50px;height:50px;border-radius:50%;background:var(--c-acc);color:#fff;display:grid;place-items:center;flex:none}
}
body.gated .nav,body.gated .nav-r,body.gated .dock,body.gated .appbar .rbtn{display:none!important}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:.92rem;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--on-ink)}
.btn.line{background:var(--surface);border:1px solid var(--bd);color:var(--ink)}
.btn.danger{color:var(--bad)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--bd);background:var(--surface);font-weight:600;font-size:.82rem;white-space:nowrap}
.pill-btn.rose{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.icbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icbtn.bd{border:1px solid var(--bd);background:var(--surface)}
.icbtn:disabled{opacity:.3}
.link{color:var(--rose);font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--bd);background:var(--surface);font-size:.82rem;font-weight:500;color:var(--ink-2);flex:none}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.chip b{font-weight:600;color:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill-delta{display:inline-flex;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill-delta.up{background:var(--bad-soft);color:var(--bad)}.pill-delta.down{background:var(--good-soft);color:var(--good)}

/* ---------- big title and the month capsules ---------- */
.big{margin:4px 0 0;font-size:clamp(2.1rem,10vw,3rem);font-weight:700;letter-spacing:-.045em;line-height:1.02;text-wrap:balance}
.big .script{font-weight:700}
.big .num{white-space:nowrap}
.big small{display:block;font-size:.95rem;font-weight:500;letter-spacing:0;color:var(--muted);margin-bottom:6px}
.caps{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;overscroll-behavior-x:contain}
.caps::-webkit-scrollbar{display:none}
.cap{flex:none;width:54px;height:70px;border-radius:999px;border:1px solid var(--bd);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.84rem;font-weight:500;color:var(--ink-2);position:relative;transition:background .2s,color .2s}
.cap small{font-size:.7rem;color:var(--muted);font-weight:500}
.cap.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}.cap.on small{color:inherit;opacity:.65}
.cap.now:not(.on)::before{content:"";position:absolute;top:8px;width:5px;height:5px;border-radius:50%;background:var(--c-acc)}
.cap:disabled{opacity:.35;cursor:default}
.cap.ano{width:auto;padding:0 16px;height:70px;background:var(--rose-soft);border-color:transparent;color:var(--rose)}.cap.ano.on{background:var(--rose);color:#fff}

/* ---------- bento: colored tiles of different sizes ---------- */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bento>*{min-width:0}
.span2{grid-column:span 2}
@media (min-width:900px){.bento{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}.span2{grid-column:span 2}.span4{grid-column:span 4}}
@media (max-width:899px){.span4{grid-column:span 2}}
.tile{position:relative;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--t-txt);overflow:hidden;text-align:left;min-height:0}
.t-ink{background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c-acc) 34%,transparent),transparent 58%),var(--t-ink);color:#fff}
.t-rose{background:var(--t-rose)}.t-blush{background:var(--t-blush)}.t-sky{background:var(--t-sky)}.t-sand{background:var(--t-sand)}
.t-white{background:var(--surface);border:1px solid var(--bd)}
.tile h2{font-size:1.15rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.tile .t-lbl{font-size:.82rem;font-weight:500;opacity:.75}
.tile .t-big{font-size:clamp(1.35rem,6.2vw,1.9rem);font-weight:700;letter-spacing:-.035em;line-height:1.1;white-space:nowrap}
.tile .t-big .brl{font-size:.62em;font-weight:600;opacity:.7}
.tile .t-sub{font-size:.78rem;opacity:.72}
.tile .t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile .t-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);color:var(--c-ink);flex:none}
.t-ink .t-ico{background:rgba(255,255,255,.14);color:#fff}
.tile .t-go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-ink);color:#fff;flex:none}
.t-ink .t-go{background:var(--c-acc)}
.tile .t-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tile .t-tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.6);color:var(--c-ink);white-space:nowrap}
.t-ink .t-tag{background:rgba(255,255,255,.14);color:#fff}
.tile .t-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.tile.go{cursor:pointer}
.tile .rw{border-bottom-color:color-mix(in srgb,currentColor 12%,transparent)}
/* the dark progress tile: a ring and three numbers */
.prog{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .rc b{font-size:1.65rem;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.ring .rc b small{font-size:.55em;font-weight:600;margin-left:1px}
.ring .rc em{font-style:normal;font-size:.68rem;opacity:.7;margin-top:2px}
.pl3{display:flex;flex-direction:column;gap:10px;min-width:0;padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}
.pl3>div{display:flex;flex-direction:column;min-width:0}
.pl3 span{font-size:.72rem;opacity:.65}
.pl3 b{font-size:1.02rem;font-weight:600;white-space:nowrap}
.pl3 b .brl{font-size:.75em;opacity:.7;font-weight:500}
@media (max-width:370px){.prog{grid-template-columns:100px minmax(0,1fr)}.ring{width:100px;height:100px}}
/* bank cards, stacked like a wallet */
.stack{display:flex;flex-direction:column}
.ccard{position:relative;border-radius:24px;padding:16px 18px 18px;color:#fff;min-height:118px;overflow:hidden;display:flex;flex-direction:column;gap:2px;box-shadow:0 -6px 16px rgba(0,0,0,.08);text-align:left;width:100%}
.stack .ccard{height:132px}.stack .ccard+.ccard{margin-top:-78px}
.stack .ccard:not(:last-child) .cc-v,.stack .ccard:not(:last-child) .cc-s,.stack .ccard:not(:last-child) .t-go{visibility:hidden}
.ccard .cc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:.95rem}
.ccard .cc-top small{font-size:.72rem;font-weight:500;opacity:.8}
.ccard .cc-v{font-size:1.45rem;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.ccard .cc-v .brl{font-size:.65em;opacity:.8}
.ccard .cc-s{font-size:.76rem;opacity:.85}
.ccard .t-go{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.22)}
/* status pills with a count bubble */
.spills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.spills::-webkit-scrollbar{display:none}
.sp{flex:none;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 6px;border-radius:999px;border:1px solid var(--bd);background:var(--surface);font-weight:600;font-size:.86rem;color:var(--ink-2)}
.sp i{font-style:normal;min-width:34px;height:34px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--sunk);font-size:.8rem;color:var(--ink)}
.sp small{font-weight:500;color:var(--muted);font-size:.74rem}
.sp[aria-pressed="true"]{background:var(--t-rose);border-color:transparent;color:var(--t-txt)}
.sp[aria-pressed="true"] i{background:#fff;color:var(--c-ink)}
.sp[aria-pressed="true"] small{color:var(--t-txt);opacity:.75}
@media (min-width:1100px){.lanc-sp{display:none}}

/* ---------- lists ---------- */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:26px;padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:24px}
.card-h h2{font-size:1.05rem;font-weight:600}
.card-h .sub{font-size:.8rem;color:var(--muted);text-align:right}
.card.flush{padding-bottom:8px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem}
.empty .ico{width:26px;height:26px;color:var(--rose-mid)}
.vazio{padding:14px 0;color:inherit;opacity:.7;font-size:.86rem;text-align:center}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.err{font-size:.84rem;color:var(--bad);margin:0}
.banner{font-size:.82rem;color:var(--muted);padding:10px 14px;border-radius:16px;background:var(--sunk)}
.pending{font-size:.8rem;color:var(--warn);background:var(--warn-soft);padding:8px 14px;border-radius:16px;display:flex;gap:8px;align-items:center}
.cols{display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.cols>.col{display:flex;flex-direction:column;gap:16px;min-width:0}}
@media (max-width:899px){.cols>.col{display:contents}}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:inherit}
.rw:last-child{border-bottom:0}
.rw.ck{grid-template-columns:28px minmax(0,1fr) auto}
.rw .tap{display:contents;cursor:pointer}
.rw-d{min-width:0;display:flex;flex-direction:column;gap:2px}
.rw-d b{font-weight:500;font-size:.96rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-d small{font-size:.76rem;opacity:.7;display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:1.35}
.rw-d small.pp{opacity:1}.rw-d small.pp b{display:inline;font-weight:600;font-size:inherit;color:var(--rose)}
.rw-v{font-weight:600;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}

async function migrarSaldos(){
  if(!sb||!crypto?.subtle||items.has('migr_saldos')||saldos().length||!canWrite) return;
  try{ const k=await sb.from('segredos').select('valor').eq('nome','chave_historico').maybeSingle(); const chave=k.data?.valor; if(!chave) return;
    const r=await fetch('saldos.enc.json',{cache:'no-store'}); if(!r.ok) return; const e=await r.json();
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(chave),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const arr=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.data))));
    if(items.has('migr_saldos')||saldos().length) return;
    await store.bulk([...arr.map(x=>({id:'saldo_'+x.mes,tipo:'saldo',...x})),{id:'migr_saldos',tipo:'migracao',em:new Date().toISOString(),n:arr.length}]);

function progTile(m){
  const r=resumo(m), contas=ofMes(m,'conta'), falta=sumResta(contas), pagas=contas.filter(c=>c.pago).length, pct=r.C?(r.C-falta)/r.C:0;

      ${pts.length>1?`<svg class="g-spark" viewBox="-3 0 ${W+6} ${H}" aria-hidden="true"><polyline points="${pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".7"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3.5" fill="currentColor"/></svg>`:''}</div>

function proximas(m){
  const t=today(), cur=m===t.slice(0,7), contas=ofMes(m,'conta').filter(c=>!c.pago).sort(byDate);

  const quando=c=>{ if(!c.data) return ''; const d=dDiff(c.data,t); return !cur?'vence '+dm(c.data):d<0?`<span class="late">venceu há ${-d} dia${d<-1?'s':''}</span>`:d===0?'vence hoje':`vence em ${d} dia${d>1?'s':''}`; };
  const rows=pend.slice(0,4).map(c=>linha(c,'conta',[quemTxt(c),quando(c)].filter(Boolean).join(' · '))).join('');
  return `<section class="tile t-white span2"><div class="t-top"><h2>${cur?'próximas <span class="script">contas</span>':'contas <span class="script">em aberto</span>'}</h2><button class="t-go" data-vercontas="1" aria-label="ver todas">${ic('ne','sm')}</button></div>

function linha(i,tipo,meta){

const quemTxt=i=>`<span class="dot ${i.quem}"></span>${QUEM[i.quem]||''}`;

    if(pg.length) h+=bloco(`<span>${ic('check','sm')} pagas</span><span class="num">${fmt(sum(pg))}</span>`,porBanco(pg,meta,false));

// bills on the same card stay separate lines, held together under the card's name and color
function porBanco(arr,meta,aberto){
  const B=BK(), soltas=[], g=new Map();
  for(const c of arr){ const b=banco(c); if(b&&b!=='boleto'){ if(!g.has(b)) g.set(b,[]); g.get(b).push(c); } else soltas.push(c); }
  let h=soltas.map(c=>linha(c,'conta',meta(c))).join('');

// The couple's history ships encrypted (dados.enc.json, AES-GCM). The key lives in the 'segredos' table, readable

async function seedInicial(){
  const f=(window.FIN_CONFIG||{}).dadosIniciais; if(!f||!crypto?.subtle) return;
  const k=await sb.from('segredos').select('valor').eq('nome','chave_historico').maybeSingle(); const chave=k.data?.valor; if(!chave) return;
  try{
    const r=await fetch(f,{cache:'no-store'}); if(!r.ok) return; const e=await r.json();
    const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(chave),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const arr=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.data))));
    bannerMsg=''; toast(`trazendo ${arr.length} lançamentos…`,'upload');
    await store.bulk(arr); toast(`${arr.length} lançamentos prontos`);
  }catch(err){ bannerMsg='não consegui trazer o histórico. em ajustes, use importar backup.'; }
}

async function saveFile(name,data,type){
  try{ const dl=window.claude?.use? await window.claude.use('downloads'):null; if(dl){ await dl.save({filename:name,data}); return; } }catch(e){ if(e?.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('não consegui gerar o arquivo.','alert'); }
}
function exportJson(){ saveFile(`financeiro-backup-${today()}.json`, JSON.stringify({app:'financeiro',versao:1,exportado:new Date().toISOString(),itens:[...items.values()].filter(i=>!i.removido)}), 'application/json'); }
async function readImport(file){
  try{ const j=JSON.parse(await file.text()); const arr=(Array.isArray(j)?j:j.itens||[]).filter(i=>i&&i.id&&i.tipo&&(i.mes||i.tipo==='banco'||i.tipo==='meta'));
    if(!arr.length){ toast('esse arquivo não tem lançamentos.','alert'); return; } importPend=arr; render();
  }catch(e){ toast('não consegui ler esse arquivo.','alert'); }
}
async function doImport(){
  const arr=importPend; importPend=null; render(); toast(`importando ${arr.length} lançamentos…`,'upload');
  try{ if(store.bulk) await store.bulk(arr); else for(const it of arr) await store.put(it); toast(`${arr.length} lançamentos importados`); autoDone=false; autoParcelas(); }
  catch(e){ toast('a importação parou no meio. tente de novo.','alert'); }
}
async function doLogin(){
  const email=$('#l-email').value.trim().toLowerCase(), pass=$('#l-pass').value; const err=t=>{const e=$('#l-err');e.textContent=t;e.hidden=false};
  if(!email||!pass) return err('preencha email e senha.');
  const btn=$('#loginF button[type=submit]'); btn.disabled=true; btn.textContent='entrando…';
  let r=await sb.auth.signInWithPassword({email,password:pass});
  // first time: no account yet for this email, so create it with the password just typed
  if(r.error&&/invalid login/i.test(r.error.message||'')){
    if(pass.length<6){ btn.disabled=false; btn.innerHTML=`${ic('lock','sm')} entrar`; return err('senha incorreta. se for o primeiro acesso, use pelo menos 6 caracteres.'); }
    const u=await sb.auth.signUp({email,password:pass});
    if(u.error&&/already registered/i.test(u.error.message||'')) r={error:{message:'invalid login'}}; else r=u;
  }
  btn.disabled=false; btn.innerHTML=`${ic('lock','sm')} entrar`;
  if(r.error){ const m=r.error.message||''; return err(/invalid login/i.test(m)?'senha incorreta.':/not confirmed/i.test(m)?'no supabase, desligue "confirm email" e tente de novo.':'não deu certo: '+m.toLowerCase()); }
  if(!r.data?.session) err('no supabase, desligue "confirm email" e tente de novo.');
}

  if(d.lt){ ui.lt=d.lt; ui.cat=null; ui.add=null; ui.qtipo={contas:'conta',gastos:'gasto',entradas:'entrada'}[d.lt]; render(); return; }
  if(d.qq){ ui.qquem=d.qq; if($('#sF')){ const k=keepVals('s'); openQuick(ui.qtipo); putVals('s',k); } else render(); return; }
  if(d.bankedit!==undefined){ abrirBanco(d.bankedit); return; }
  if(d.bksw){ setCorBanco(d.bksw); return; }
  if(d.bksave){ salvarBanco(); return; }
  if(d.bkcancel){ if(e.target===t||t.tagName==='BUTTON'){ bkEd=null; $('#sheetHost').innerHTML=''; } return; }
  if(d.bkdel){ const n=bkEd.orig, id='banco_'+slug(n); bkEd=null; $('#sheetHost').innerHTML=''; safe(store.put({...(items.get(id)||{}),id,tipo:'banco',nome:n,oculto:true}),`${n} saiu da lista`); return; }
  if(d.modo){ modo=d.modo; try{localStorage.setItem('fin-modo',modo)}catch(_){} applyModo(); applyTema(tema); render(); return; }
  if(d.bankadd){ const n=($('#bk-nome').value||'').trim().toLowerCase(); if(!n){ toast('escreva o nome do banco.','alert'); return; }
    safe(store.put({...(items.get('banco_'+slug(n))||{}),id:'banco_'+slug(n),tipo:'banco',nome:n,cor:$('#bk-cor').value,oculto:false}),`${n} adicionado`); return; }
  if(d.bankdel){ const n=d.bankdel, id='banco_'+slug(n);
    safe(store.put({...(items.get(id)||{}),id,tipo:'banco',nome:n,oculto:true}),`${n} saiu da lista`);
    return; }
  if(d.bankrestore){ for(const b of bankDocs().filter(b=>b.oculto)) safe(store.patch(b.id,{oculto:false})); toast('bancos de volta'); return; }
  if(d.tema){ const t=TEMAS.find(x=>x[0]===d.tema); if(t){ setTema({id:t[0],...t[2]}); toast('cor salva'); } return; }
  if(d.sair){ ['fin-foto','fin-foto-orig','fin-icone','fin-tema','fin-pend','fin-fonte'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}}); foto=null; icone={id:'wallet'}; outbox=[]; applyTema({id:'nova',...TEMAS[0][2]}); applyIcone(); sb?.auth.signOut(); return; }
  if(d.export){ exportJson(); return; }
  if(d.impok){ doImport(); return; }
  if(d.impcancel){ importPend=null; render(); return; }
  if(d.close!==undefined){ if(e.target===t||t.tagName==='BUTTON'){form=null;drawSheet();} return; }
  if(d.goto&&ui.busca){ ui.busca=''; }
  if(d.page){ ui.page=d.page; ui.cat=null; ui.busca=''; saveUi(); render(); if(d.metas) $('#metas')?.scrollIntoView({block:'start'}); else window.scrollTo({top:0}); return; }
  if(d.mstep){ ui.mes=addM(ui.mes,+d.mstep); render(); return; }
  if(d.goto){ ui.mes=d.goto; ui.page='lanc'; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(d.pagar){ if(!canWrite) return; const it=items.get(d.pagar); if(it) safe(store.patch(it.id,{pago:!it.pago}), it.pago?'voltou para a pagar':'conta paga'); return; }
  if(d.edit){ if(!canWrite) return; const it=items.get(d.edit); if(it) openSheet(it); return; }
  if(d.new){ ui.contN=0; openQuick(d.new==='auto'?({contas:'conta',entradas:'entrada'}[ui.lt]||'gasto'):d.new); return; }
  if(d.cat!==undefined){ ui.cat=d.cat||null; ui.lt='gastos'; const ir=ui.page!=='lanc'; ui.page='lanc'; saveUi(); render(); if(ir) window.scrollTo({top:0}); return; }
  if(d.ano){ ui.ano=d.ano; render(); return; }
  if(d.copiar){ repetirFixas(); return; }
  if(d.csv){ exportCsv(); return; }
  if(d.ft){ readForm(); form.tipo=d.ft; if(form.tipo==='entrada'&&form.quem==='juntos') form.quem='lais'; if(d.ft==='conta'&&form.pago===undefined) form.pago=false; drawSheet(); return; }
  if(d.fq){ readForm(); form.quem=d.fq; drawSheet(); return; }
  if(d.addparc){ readForm(); const v=parseV($('#f-pv').value); if(!(v>0)){ const e=$('#f-err'); e.textContent='digite quanto pagou agora, por exemplo 300.'; e.hidden=false; return; }
    form.parciais=[...(form.parciais||[]),{v,d:today()}]; const tot=parseV(form.valor); if(isFinite(tot)&&form.parciais.reduce((s,p)=>s+p.v,0)>=tot-0.004) form.pago=true; drawSheet(); return; }
  if(d.delparc!==undefined){ readForm(); form.parciais=(form.parciais||[]).filter((_,i)=>i!==+d.delparc); drawSheet(); return; }
  if(d.askdel){ readForm(); form.confirm=true; drawSheet(); return; }
  if(d.del){ const id=form.id, old=items.get(id); form=null; drawSheet(); if(!old) return;
    const soft=old.auto||(old.tipo==='conta'&&parc(old.desc));
    safe(soft?store.patch(id,{removido:true}):store.del(id)).then(()=>toast('excluído','trash',{undo:()=>{ const {removido,...back}=old; return safe(store.put(back),'voltou'); }})); return; }
  if(d.undo){ const f=toast.undo; toast.undo=null; $('#toastHost').innerHTML=''; f?.(); return; }
});
document.addEventListener('change',async e=>{ if(e.target.id==='contLanc'){ ui.cont=e.target.checked; try{localStorage.setItem('fin-cont',ui.cont?'1':'0')}catch(_){} return; } if(e.target.id==='fonteFile'&&e.target.files.length){ await lerFontes([...e.target.files]); e.target.value=''; return; } if(e.target.id==='fotoFile'&&e.target.files[0]){ try{ const o=await lerOriginal(e.target.files[0]); try{localStorage.setItem('fin-foto-orig',o)}catch(_){} abrirFoto(o); }catch(_){ toast('não consegui abrir essa foto.','alert'); } e.target.value=''; return; } if(e.target.dataset?.meta!==undefined){ const c=e.target.dataset.meta, id='meta_'+slug(c), raw=e.target.value.trim(), v=parseV(raw);
    if(!raw||!(v>0)){ if(items.has(id)) safe(store.del(id),`meta de ${c} tirada`); return; }
    safe(store.put({id,tipo:'meta',cat:c,valor:v}),`meta de ${c}: ${fmtT(v)} por mês`); return; } if(e.target.dataset?.bankcor){ const n=e.target.dataset.bankcor; const id='banco_'+slug(n); safe(store.put({...(items.get(id)||{}),id,tipo:'banco',nome:n,cor:e.target.value}),'cor do banco salva'); return; } if(e.target.id==='impFile'&&e.target.files[0]) readImport(e.target.files[0]); if(e.target.id==='temaCor'){ setTema(temaCustom(e.target.value)); toast('cor salva'); } });
document.addEventListener('submit',e=>{ if(e.target.id==='sheet'){e.preventDefault();submit();} if(e.target.id==='loginF'){e.preventDefault();doLogin();} if(e.target.id==='gF'){ e.preventDefault(); const o={id:'saldo_'+ui.mes,tipo:'saldo',mes:ui.mes}; for(const [k] of SALDO_K){ const v=parseV($('#g-'+k).value||'0'); o[k]=isFinite(v)?v:0; } ui.editSaldo=false; safe(store.put(o),'valores guardados'); return; } const qm=/^(q|s|ae|ac|ag)F$/.exec(e.target.id); if(qm){e.preventDefault();quickAdd(qm[1]);} });
document.addEventListener('input',e=>{
  if(e.target.id==='temaCor'){ applyTema(temaCustom(e.target.value)); return; }
  if(bkEd&&/^bk-/.test(e.target.id)){ const id=e.target.id;
    if(id==='bk-nm'){ bkEd.nome=e.target.value; $('#bkPrev').textContent=(bkEd.nome||'?').replace(/[^a-z0-9à-ú]/gi,'').slice(0,2); return; }
    if(id==='bk-hex'){ let v=e.target.value.trim(); if(!v.startsWith('#')) v='#'+v; if(/^#[0-9a-f]{6}$/i.test(v)) setCorBanco(v,'hex'); return; }
    if(['bk-r','bk-g','bk-b'].includes(id)){ const v=['r','g','b'].map(k=>+$('#bk-'+k).value||0); setCorBanco(toHex(...v),'rgb'); return; }
    if(['bk-h','bk-s','bk-l'].includes(id)){ setCorBanco(toHex(...fromHsl(+$('#bk-h').value,+$('#bk-s').value,+$('#bk-l').value)),'hsl'); return; } }
  if(e.target.id==='cropZ'&&crop){ const z=+e.target.value, r=z/crop.z; crop.x*=r; crop.y*=r; crop.z=z; cropPaint(); return; }
  if(e.target.id==='bk-cor'){ $('#bk-sw').style.background=e.target.value; return; }
  if(/^(q|s|ae|ac|ag)-desc$/.test(e.target.id)){ const p=e.target.id.split('-')[0], d=e.target.value; const ch=$('#'+p+'-cathint'); if(ch) ch.innerHTML=d.trim()?`categoria: <b>${esc(cat({desc:d}))}</b> · dá para trocar depois tocando no gasto`:'a categoria é identificada sozinha pelo que você escrever.'; const b=$('#'+p+'-bank'); if(b){ const k=banco({tipo:'conta',desc:d}); b.value=k||''; } }
  if(e.target.id==='q-busca'){ ui.busca=e.target.value; clearTimeout(window._bq); window._bq=setTimeout(render,120); return; }
  if(e.target.id==='f-desc'){ if($('#f-cat')) $('#f-cat').value=cat({desc:e.target.value}); if($('#f-bank')&&form&&form.bankSel===undefined&&form.banco===undefined){ const b=banco({tipo:'conta',desc:e.target.value}); $('#f-bank').value=b||''; } }
});
let rz; let lastW=window.innerWidth; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(lastW-window.innerWidth)>40){lastW=window.innerWidth;render();}},200)});
const tipEl=()=>$('#tip');
function showTip(el,x,y){ const t=tipEl(); t.innerHTML=el.dataset.tip.split('|').join('<br>'); t.hidden=false; const w=t.offsetWidth; t.style.left=Math.min(Math.max(x,w/2+8),innerWidth-w/2-8)+'px'; t.style.top=Math.max(y,t.offsetHeight+20)+'px'; }
document.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; const el=e.target.closest?.('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else if(!tipEl().hidden) tipEl().hidden=true; });
document.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; const el=e.target.closest?.('[data-tip]'); document.querySelectorAll('.hit.on').forEach(h=>h.classList.remove('on')); if(el){ showTip(el,e.clientX,e.clientY); el.classList.add('on'); } else tipEl().hidden=true; });
addEventListener('scroll',()=>{ if(!tipEl().hidden) tipEl().hidden=true; },{passive:true});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&/^(q|s|ae|ac|ag)-valor$/.test(e.target.id)&&!$('#'+e.target.id.split('-')[0]+'-desc').value){ e.preventDefault(); $('#'+e.target.id.split('-')[0]+'-desc').focus(); return; } if(e.key==='Enter'&&e.target.id==='f-pv'){ e.preventDefault(); $('[data-addparc]')?.click(); return; } if(e.key==='Enter'&&/^(q|s|ae|ac|ag)-desc$/.test(e.target.id)&&!$('#'+e.target.id.split('-')[0]+'-valor').value){ e.preventDefault(); $('#'+e.target.id.split('-')[0]+'-valor').focus(); return; } if(e.key==='Escape'&&$('#dupHost').innerHTML){ $('#dupHost').innerHTML=''; dupPend=null; return; } if(e.key==='Escape'){ if(form){form=null;drawSheet();} else { crop=null; $('#sheetHost').innerHTML=''; } } });

// phones keep the app suspended for hours: when it comes back, catch up with what the other one changed
// and, if the month turned meanwhile, move to the new month and carry the installments
let hiddenAt=0, dia=today();
async function voltar(){
  const t=today(); if(t!==dia){ if(ui.mes===dia.slice(0,7)) ui.mes=t.slice(0,7); dia=t; autoDone=false; }
  if(mode==='nuvem'&&session&&!gate){ await flush(); await loadAll(); }
  render(); if(!autoDone) setTimeout(autoParcelas,300);
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') hiddenAt=Date.now(); else if(Date.now()-hiddenAt>45000||today()!==dia) voltar(); else if(render.pend) render(); });
addEventListener('online',()=>flush());

// dragging the photo inside the frame (mouse or finger)
let drag=null;
document.addEventListener('pointerdown',e=>{ if(!crop||!e.target.closest?.('#cropBox')) return; e.preventDefault(); drag={x:e.clientX,y:e.clientY,ox:crop.x,oy:crop.y}; try{$('#cropBox').setPointerCapture(e.pointerId)}catch(_){} });
document.addEventListener('pointermove',e=>{ if(!drag||!crop) return; crop.x=drag.ox+e.clientX-drag.x; crop.y=drag.oy+e.clientY-drag.y; cropPaint(); });
document.addEventListener('pointerup',()=>{ drag=null; }); document.addEventListener('pointercancel',()=>{ drag=null; });

// iphone safari ignores user-scalable=no for pinch, so the pinch gesture is blocked here
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});

let sw=null;
document.addEventListener('touchstart',e=>{ if(e.touches.length!==1||!['inicio','lanc'].includes(ui.page)||$('#sheetHost').innerHTML||e.target.closest('.caps,.spills,.stack,.chips,.chart,.viz,input,select,textarea,.dock,.topnav,.addrow')){ sw=null; return; }
  sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}; },{passive:true});
document.addEventListener('touchend',e=>{ if(!sw) return; const t=e.changedTouches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y, dt=Date.now()-sw.t; sw=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<Math.abs(dx)*.5&&dt<600){ const k=addM(ui.mes,dx<0?1:-1); if(mesOk(k)) irMes(k); } },{passive:true});
document.addEventListener('toggle',e=>{ if(e.target.classList?.contains('mais')){ const was=ui.mais; ui.mais=e.target.open; if(ui.mais&&!was) render(); } },true);

applyIcone();
boot();
// new version: a bar with "atualizar" shows up; one tap switches to it and reloads
if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude && /github\.io$|localhost/.test(location.hostname)){
  const avisar=w=>{ if(!w||!navigator.serviceWorker.controller) return; $('#updHost').innerHTML=`<div class="upd">${ic('repeat','sm')}<span>nova versão do app</span><button data-atualizar="1">atualizar</button></div>`; avisar.w=w; };
  navigator.serviceWorker.register('sw.js').then(reg=>{
    avisar(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w?.addEventListener('statechange',()=>{ if(w.state==='installed') avisar(w); }); });
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{});
  let recarregou=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(recarregou) return; recarregou=true; location.reload(); });
  document.addEventListener('click',e=>{ if(!e.target.closest('[data-atualizar]')) return; const b=e.target.closest('[data-atualizar]'); b.textContent='atualizando…'; b.disabled=true;
    if(avisar.w) avisar.w.postMessage('atualizar'); else location.reload(); setTimeout(()=>location.reload(),4000); });
}
})();
</script>
