<style>
/* Layout: sidebar on wide screens, icon rail on tablets, bottom tab bar on phones.
   Floating pill nav (top on wide screens, dark dock on phones), magazine-style opener with a spinning stamp,
   oversized serif figures for money, and a month "ruler" that reads like a measuring tape.
   Each person picks a color on their own device: three inputs (--c-ink, --c-acc, --c-paper) drive every token.
   All copy lowercase; only the R in R$ stays uppercase. */
:root{
  --c-ink:#33414d; --c-acc:#ad7466; --c-paper:#f5f0ed;
  --bg:var(--c-paper); --surface:color-mix(in srgb,var(--c-paper) 25%,#fff);
  --sunk:color-mix(in srgb,var(--c-paper) 88%,var(--c-ink)); --line:color-mix(in srgb,var(--c-paper) 86%,var(--c-acc));
  --ink:var(--c-ink); --ink-2:color-mix(in srgb,var(--c-ink) 80%,var(--c-paper)); --muted:color-mix(in srgb,var(--c-ink) 52%,var(--c-paper)); --on-ink:#fffdfb;
  --rose:var(--c-acc); --rose-soft:color-mix(in srgb,var(--c-acc) 13%,var(--surface)); --rose-mid:color-mix(in srgb,var(--c-acc) 55%,var(--surface));
  --hero:var(--c-ink); --glow:color-mix(in srgb,var(--c-acc) 22%,transparent);
  --lais:#b5677e; --igor:#4d6b85; --juntos:#a68b55;
  --good:#4c7a5c; --good-soft:#e3efe6; --bad:#b4533f; --bad-soft:#f8e1da; --warn:#a2702c; --warn-soft:#f6ead6;
  --shadow:0 1px 2px rgba(30,30,30,.04),0 8px 28px rgba(30,30,30,.06);
  --f-ui:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-num:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--c-ink) 30%,#121416); --surface:color-mix(in srgb,var(--c-ink) 34%,#1c1e21);
  --sunk:color-mix(in srgb,var(--c-ink) 30%,#16181a); --line:color-mix(in srgb,var(--c-ink) 40%,#2c2f33);
  --ink:#efe9e5; --ink-2:#cfc7c2; --muted:#a59c97; --on-ink:#16181a;
  --rose:color-mix(in srgb,var(--c-acc) 62%,#fff); --rose-soft:color-mix(in srgb,var(--c-acc) 22%,var(--surface)); --rose-mid:color-mix(in srgb,var(--c-acc) 70%,var(--surface));
  --hero:color-mix(in srgb,var(--c-ink) 70%,#0e0f10); --glow:color-mix(in srgb,var(--c-acc) 18%,transparent);
  --lais:#e59ab0; --igor:#8fb0cf; --juntos:#d4b67c;
  --good:#8cc29f; --good-soft:#203229; --bad:#f09a86; --bad-soft:#3d2420; --warn:#e3b86c; --warn-soft:#382d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--c-ink) 30%,#121416); --surface:color-mix(in srgb,var(--c-ink) 34%,#1c1e21);
  --sunk:color-mix(in srgb,var(--c-ink) 30%,#16181a); --line:color-mix(in srgb,var(--c-ink) 40%,#2c2f33);
  --ink:#efe9e5; --ink-2:#cfc7c2; --muted:#a59c97; --on-ink:#16181a;
  --rose:color-mix(in srgb,var(--c-acc) 62%,#fff); --rose-soft:color-mix(in srgb,var(--c-acc) 22%,var(--surface)); --rose-mid:color-mix(in srgb,var(--c-acc) 70%,var(--surface));
  --hero:color-mix(in srgb,var(--c-ink) 70%,#0e0f10); --glow:color-mix(in srgb,var(--c-acc) 18%,transparent);
  --lais:#e59ab0; --igor:#8fb0cf; --juntos:#d4b67c;
  --good:#8cc29f; --good-soft:#203229; --bad:#f09a86; --bad-soft:#3d2420; --warn:#e3b86c; --warn-soft:#382d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-transform:lowercase}
.brl,input,select,textarea{text-transform:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-transform:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:20px;height:20px}
.script{font-family:var(--f-script);font-style:italic;font-weight:300;color:var(--rose);letter-spacing:0;font-size:1.15em}
.glow{position:fixed;width:60vmax;height:60vmax;right:-18vmax;top:-12vmax;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none;z-index:-1}
h1,h2,.stat .v,.brand b,.tl-d b{font-family:var(--f-display)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:.78rem;font-weight:600;letter-spacing:.14em;color:var(--rose)}
.eyebrow::before{content:"";width:28px;height:1.5px;background:var(--rose)}
.lbl{font-size:.7rem;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:50%;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center;font-family:var(--f-script);font-style:italic;font-size:1.3rem;flex:none}
.brand b{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-family:var(--f-ui)}
.brand b i{font-style:normal;color:var(--rose)}
.brand small{font-size:.72rem;color:var(--muted);display:block;line-height:1}
.topnav{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;margin:12px auto 0;width:min(1180px,calc(100% - 32px));display:flex;align-items:center;gap:14px;padding:8px 8px 8px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:0 12px 40px rgba(20,20,20,.08)}
.nav{display:flex;gap:2px;margin:0 auto}
.nav a{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:.92rem;cursor:pointer;position:relative;white-space:nowrap}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nav a .badge{min-width:20px;height:20px;border-radius:99px;background:var(--c-acc);color:#fff;font-size:.7rem;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav-r{display:flex;gap:6px;align-items:center}
.main{min-width:0;padding:34px 16px 80px;display:flex;flex-direction:column;gap:22px;max-width:1180px;margin:0 auto;width:100%}
.dock{display:none}
@media (max-width:1040px){.nav a .ico{display:none}.nav a{padding:10px 12px}.brand div{display:none}}
@media (max-width:700px){
  .nav,.nav-r .btn{display:none}
  .brand div{display:block}
  .topnav{padding:6px 6px 6px 8px}
  .main{padding:22px 16px calc(120px + env(safe-area-inset-bottom,0px));gap:18px}
  .dock{display:grid;grid-template-columns:repeat(3,1fr) 64px repeat(3,1fr);align-items:end;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--hero);border-radius:26px;padding:8px 6px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
  .dock a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:.6rem;font-weight:500;color:rgba(255,255,255,.62);border-radius:16px;cursor:pointer;position:relative}
  .dock a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.13)}
  .dock a .dotb{position:absolute;top:5px;right:calc(50% - 15px);width:8px;height:8px;border-radius:50%;background:var(--c-acc);box-shadow:0 0 0 2px var(--hero)}
  .dock .plus{justify-self:center;width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--c-acc);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--bg),0 10px 24px color-mix(in srgb,var(--c-acc) 55%,transparent)}
}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph-l{display:flex;flex-direction:column;gap:8px;min-width:0}
.mnav{display:flex;align-items:center;gap:6px}
.mnav h1{margin:0;font-size:clamp(2.6rem,7vw,5rem);font-weight:700;letter-spacing:-.05em;line-height:.95;display:flex;align-items:baseline;gap:.25em;flex-wrap:wrap}
.mnav h1 .script{font-size:1.05em;font-weight:300;letter-spacing:-.01em}
.ruler{display:flex;overflow-x:auto;scrollbar-width:none;margin:6px -16px 0;padding:0 16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.ruler::-webkit-scrollbar{display:none}
.ruler button{flex:none;min-width:78px;height:50px;padding:6px 0 0 7px;text-align:left;font-size:.8rem;font-weight:500;color:var(--muted);border-left:1.5px solid color-mix(in srgb,var(--ink) 40%,transparent);background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 22%,transparent) 0 1px,transparent 1px 9.75px) left bottom/100% 10px no-repeat;position:relative}
.ruler button small{display:block;font-size:.66rem;opacity:.7}
.ruler button:hover{color:var(--ink)}
.ruler button[aria-current="true"]{color:var(--c-acc);font-weight:700;border-left-color:var(--c-acc)}
.ruler button[aria-current="true"]::after{content:"";position:absolute;left:-1.5px;right:0;bottom:0;height:3px;background:var(--c-acc);border-radius:2px}
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icbtn:hover{background:var(--sunk)}
.icbtn:disabled{opacity:.3;cursor:default}
.ph-r{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--on-ink);box-shadow:0 8px 22px rgba(51,65,77,.22)}
.btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.line:hover{background:var(--sunk)}
@media (max-width:700px){.ph-r .btn{height:40px;padding:0 14px;font-size:.84rem}}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.82rem;white-space:nowrap}
.pill-btn:hover{border-color:var(--rose-mid)}
.pill-btn.rose{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.pill-btn.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.link{color:var(--rose);font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:4px}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;min-width:0}
@media (max-width:700px){.card{padding:18px 16px}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:1.1rem;font-weight:600;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.stats{gap:10px}}
.stat{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
button.stat:hover{box-shadow:0 0 0 1px var(--rose-mid),var(--shadow)}
.stat .t{font-size:.84rem;font-weight:500;color:var(--ink-2);padding-right:44px}
.stat .v{font-family:var(--f-num);font-size:clamp(1.6rem,3vw,2.3rem);font-weight:600;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:.8rem;color:var(--muted)}
.stat .si{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:11px;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center}
@media (max-width:700px){.stat{padding:16px 14px}.stat .si{top:12px;right:12px;width:30px;height:30px}.stat .t{padding-right:34px;font-size:.78rem}}
.alert{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:16px;border:1px solid var(--line);background:var(--rose-soft);color:var(--rose);font-size:.92rem;flex-wrap:wrap}
.alert b{font-weight:600}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.good{background:var(--good-soft);color:var(--good)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-c{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:1000px){.grid-c{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* opener */
.intro{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;padding:6px 0 0}
.intro h1{margin:12px 0 0;font-size:clamp(2.8rem,8.4vw,6.6rem);line-height:.92;font-weight:700;letter-spacing:-.055em}
.intro h1 .script{display:block;font-size:.72em;line-height:1.1;letter-spacing:-.01em}
.lede{font-size:clamp(1.02rem,1.7vw,1.3rem);max-width:660px;color:var(--ink-2);margin:20px 0 0;line-height:1.65}
.hl{font-family:var(--f-num);font-weight:600;color:var(--ink);font-size:1.3em;line-height:1;padding:0 .12em;background:linear-gradient(transparent 60%,color-mix(in srgb,var(--c-acc) 22%,transparent) 60%);white-space:nowrap}
.hl.bad{color:var(--bad)}
.stamp{position:relative;width:184px;height:184px;border-radius:50%;background:var(--c-acc);color:#fff;display:grid;place-items:center;transform:rotate(-8deg);flex:none;box-shadow:0 0 0 7px var(--bg),0 0 0 8.5px color-mix(in srgb,var(--c-acc) 35%,transparent),0 22px 44px color-mix(in srgb,var(--c-acc) 35%,transparent)}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp text{fill:#fff;font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:3.4px}
.stamp b{font-family:var(--f-num);font-size:2.5rem;font-weight:700;line-height:.9;text-align:center;letter-spacing:-.01em}
.stamp b small{display:block;font-family:var(--f-ui);font-size:.62rem;font-weight:600;letter-spacing:.16em;margin-top:6px;opacity:.9}
@media (prefers-reduced-motion:no-preference){.stamp svg{animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
@media (max-width:700px){.intro{grid-template-columns:minmax(0,1fr)}.stamp{width:136px;height:136px;justify-self:end;margin-top:-34px}.stamp b{font-size:1.9rem}.stamp text{font-size:12px}}
.feature{position:relative;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c-acc) 38%,transparent),transparent 45%),var(--hero);color:#fdf9f6;border-radius:32px;padding:44px 44px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:44px;margin-top:20px}
.feature .tagtop{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:var(--c-acc);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.16em;padding:8px 18px;border-radius:99px;white-space:nowrap;box-shadow:0 0 0 5px var(--bg)}
.feature h2{font-size:1.7rem;font-weight:600;margin:0;letter-spacing:-.02em}
.feature h2 .script{color:color-mix(in srgb,var(--c-acc) 40%,#fff)}
.feature .sub{color:rgba(255,255,255,.66);margin:6px 0 16px}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.frow .ck{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;color:#fff}
.frow .ck:hover{background:rgba(255,255,255,.12)}
.frow b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{color:rgba(255,255,255,.6);font-size:.8rem}
.frow small.bad{color:#ffb4a4}
.frow .fv{font-family:var(--f-num);font-size:1.45rem;font-weight:600}
.fright{display:flex;flex-direction:column;gap:14px;justify-content:center}
.fright .k{font-size:.72rem;font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.66)}
.fbig{font-family:var(--f-num);font-size:clamp(3.4rem,8vw,6rem);font-weight:600;line-height:.85;letter-spacing:-.02em;display:flex;align-items:flex-start;gap:6px}
.fbig .brl{font-size:.32em;font-family:var(--f-ui);font-weight:500;margin-top:.5em;opacity:.8}
.fbar{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.fbar i{display:block;height:100%;background:var(--c-acc);border-radius:99px}
.btn.cream{background:#f7f0ea;color:var(--c-ink);justify-content:center;height:52px;font-size:.92rem}
.btn.ghost-l{border:1px solid rgba(255,255,255,.35);color:#fff;justify-content:center}
@media (max-width:820px){.feature{grid-template-columns:minmax(0,1fr);padding:38px 20px 24px;gap:24px;border-radius:28px}.fright{order:-1}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px 24px;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);box-shadow:var(--shadow);width:100%}
.tile:hover{box-shadow:0 0 0 1px var(--rose-mid),var(--shadow)}
.tile .k{font-size:.72rem;font-weight:600;letter-spacing:.16em;color:var(--muted)}
.tile .n{font-family:var(--f-num);font-size:clamp(2.2rem,4.4vw,3.2rem);font-weight:600;line-height:.95}
.tile .n .brl{font-family:var(--f-ui);font-size:.38em;font-weight:500;vertical-align:.9em;margin-right:4px;opacity:.7}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile .bgi{position:absolute;right:-14px;bottom:-18px;width:110px;height:110px;opacity:.07;stroke-width:1.1}
.tile.acc{background:var(--c-acc);color:#fff}.tile.acc .k,.tile.acc .s{color:rgba(255,255,255,.82)}.tile.acc .bgi{opacity:.16}
.tile.ink{background:var(--hero);color:#fff}.tile.ink .k,.tile.ink .s{color:rgba(255,255,255,.7)}.tile.ink .bgi{opacity:.14}

/* todo list */
.todo{display:flex;flex-direction:column}
.todo-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo-row:first-child{border-top:0}
.tico{width:40px;height:40px;border-radius:12px;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center}
.tico.bad{background:var(--bad-soft);color:var(--bad)}
.todo-row .tt{font-weight:500;color:var(--rose);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-row .tt.bad{color:var(--bad)}
.todo-row .ts{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.todo-row{grid-template-columns:34px minmax(0,1fr);gap:10px}.todo-row .tico{width:34px;height:34px}.todo-row .pill-btn{grid-column:2;justify-self:start}}

/* timeline */
.tl{display:flex;flex-direction:column;gap:14px}
.tl-row{display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:10px;align-items:center}
.tl-d{text-align:center;line-height:1.05}
.tl-d b{display:block;font-family:var(--f-num);font-size:1.7rem;font-weight:600}
.tl-d small{font-size:.7rem;color:var(--rose);font-weight:600}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--ink);justify-self:center}
.tl-row .x{min-width:0}.tl-row .x b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tl-row .x small{color:var(--muted);font-size:.8rem}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:.88rem;align-items:center;width:100%;text-align:left}
.bar>span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.bar .trk{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .trk i{display:block;height:100%;border-radius:99px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.lais{background:var(--lais)}.dot.igor{background:var(--igor)}.dot.juntos{background:var(--juntos)}

/* segmented */
.seg{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--sunk);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 16px;border-radius:999px;font-weight:500;font-size:.86rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);flex:1;min-width:160px;max-width:360px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink)}
.sel{height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px}

/* table → cards on phone */
.tbl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr) 128px;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.tr.head{border-top:0;padding-top:4px;padding-bottom:10px;font-size:.8rem;font-weight:500;color:var(--muted)}
.tr .c1 b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .c1 small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.8rem;flex-wrap:wrap}
.tr .val{text-align:right;font-weight:500}
.tr .act{display:flex;justify-content:flex-end}
.tr.paid .c1 b,.tr.paid .val{color:var(--muted)}
.tr .when.bad{color:var(--bad)}.tr .when.warn{color:var(--warn)}
.tr .when small{display:block;font-size:.78rem;color:var(--muted)}
.edit-area{cursor:pointer}
.cb{min-width:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cb .mob{display:none}
@media (max-width:820px){
  .tr.head{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a v" "b b" "w act";gap:8px 12px;padding:14px 0}
  .tr .c1{grid-area:a}.tr .val{grid-area:v}.tr .cb{grid-area:b}.tr .when{grid-area:w}.tr .act{grid-area:act}
  .tr .cp{display:none}.cb .mob{display:inline-flex}
}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.auto{background:var(--rose-soft);color:var(--rose)}

/* bank chip */
.bank{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:500;padding:3px 10px 3px 3px;border-radius:99px;background:var(--sunk);white-space:nowrap;max-width:100%}
.bm{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:.62rem;font-weight:700;letter-spacing:-.02em;flex:none}
.bank.none{background:transparent;border:1px dashed var(--rose-mid);color:var(--rose);padding:3px 10px}
.bank.boleto{background:transparent;color:var(--muted);padding-left:0}
.banks{display:flex;flex-direction:column;gap:4px}
.bk{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;text-align:left;width:100%}
.bk:hover{background:var(--sunk)}
.bk[aria-pressed="true"]{background:var(--rose-soft)}
.bk .bm{width:42px;height:42px;border-radius:12px;font-size:.85rem}
.bk b{font-weight:600;display:block}
.bk small{font-size:.78rem;color:var(--muted)}
.bk .r{text-align:right}

/* list (gastos/entradas) */
.day{display:flex;justify-content:space-between;padding:16px 4px 6px;font-size:.75rem;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.li{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:hover{background:var(--sunk)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff}
.li b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{font-size:.8rem;color:var(--muted)}
.li .v{font-weight:600}
.total-row{display:flex;justify-content:space-between;padding-top:14px;margin-top:4px;border-top:1.5px solid var(--ink);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.84rem;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.empty{padding:30px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .ico{width:28px;height:28px;color:var(--rose-mid)}

/* chart */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
table.yr{width:100%;border-collapse:collapse;font-size:.88rem;min-width:520px}
table.yr th{font-weight:500;color:var(--muted);text-align:right;padding:8px 6px;font-size:.8rem}
table.yr th:first-child,table.yr td:first-child{text-align:left}
table.yr td{padding:11px 6px;border-top:1px solid var(--line);text-align:right}
table.yr tr.tot td{border-top:1.5px solid var(--ink);font-weight:600}
table.yr tr.cur td{background:var(--rose-soft)}

/* fab + sheet */
.scrim{position:fixed;inset:0;background:rgba(28,34,39,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}

.sheet h2 .script{font-size:1.2em}

.f label{font-size:.8rem;font-weight:500;color:var(--ink-2)}

.segf button{height:40px;border-radius:10px;font-weight:500;font-size:.88rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.segf button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.err{font-size:.84rem;color:var(--bad);margin:0}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:14px;font-weight:500;font-size:.88rem;z-index:60;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);white-space:nowrap}

.banner{font-size:.85rem;color:var(--muted);padding:10px 16px;border-radius:12px;background:var(--sunk)}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tema{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:16px;border:1.5px solid transparent;font-size:.8rem;font-weight:500;color:var(--ink-2)}
.tema:hover{background:var(--sunk)}
.tema[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.sw2{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative}
.tema input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
body.gated .nav,body.gated .dock,body.gated .nav-r{display:none!important}
.login{max-width:420px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:left}
.login .mark{width:56px;height:56px;font-size:1.7rem}

.opt-row:first-child{border-top:0}

const addM=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const addMd=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const ym=addM(`${y}-${pad(m)}`,n);const [yy,mm]=ym.split('-').map(Number);const last=new Date(yy,mm,0).getDate();return `${ym}-${pad(Math.min(d,last))}`};

const parc=d=>{const m=/(\d+)\s*\/\s*(\d+)\s*$/.exec(d||'');return m?{x:+m[1],y:+m[2],base:d.slice(0,m.index).trim()}:null};
const baseOf=it=>(parc(it.desc)?.base||it.desc||'').trim().toLowerCase();

  const d=(it.desc||'').toLowerCase(); for(const b of bankDocs()){ const n=String(b.nome||'').toLowerCase(); if(n&&!BANKS[n]&&d.includes(n)) return n; } for(const [re,b] of BANK_RULES) if(re.test(d)) return b; return BOLETO.test(d)?'boleto':null; }
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';

let items=new Map(), store=null, canWrite=true, ready=false, autoDone=false, bannerMsg='';

const bankDocs=()=>[...items.values()].filter(i=>i.tipo==='banco'&&!i.removido);
function BK(){ const o={...BANKS}; bankDocs().forEach(b=>{ const n=String(b.nome||'').toLowerCase(); if(n) o[n]={m:(b.sigla||n.replace(/[^a-z0-9à-ú]/g,'').slice(0,2)),c:b.cor||'#8e8580',custom:!BANKS[n]}; }); return o; }
const ofMes=(m,t)=>live().filter(i=>i.mes===m&&(!t||i.tipo===t));

// ---------- storage ----------
// Three places the data can live: the claude.ai artifact store, a supabase project (github pages + config.js), or this browser only.
let mode='local', sb=null, session=null, gate=null, userEmail='', channel=null;
async function boot(){
  render();
  let db=null;
  try{ db=window.claude?.use? await window.claude.use('db'):null; }catch(e){}
  if(db){
    mode='claude';
    try{ const u=await window.claude.use('user'); const c=u?.can? await u.can('data.write'):null; if(c===false) canWrite=false; }catch(e){}
    const col=db.collection('lancamentos');
    store={put:it=>col.doc(it.id).set(it), del:id=>col.doc(id).delete(), patch:(id,o)=>col.doc(id).update(o)};
    col.onSnapshot(snap=>{
      for(const ch of snap.docChanges()){ if(ch.type==='removed') items.delete(ch.doc.id); else items.set(ch.doc.id,{...ch.doc.data(),id:ch.doc.id}); }
      if(!ready){ ready=true; setTimeout(autoParcelas,400); }
      render();
    }, ()=>{ bannerMsg='não consegui carregar os lançamentos agora. recarregue a página.'; render(); });
    return;
  }
  const cfg=window.FIN_CONFIG||{};
  if(cfg.supabaseUrl&&cfg.supabaseKey){ mode='nuvem'; return bootNuvem(cfg); }
  let arr=null; try{arr=JSON.parse(localStorage.getItem('fin2-itens')||'null')}catch(e){}
  if(!arr){ arr=[]; for(const f of ['dados-2025.json','dados.json']){ try{const r=await fetch(f); if(r.ok) arr=arr.concat(await r.json());}catch(e){} } }
  arr.forEach(i=>items.set(i.id,i));
  const persist=()=>{try{localStorage.setItem('fin2-itens',JSON.stringify([...items.values()]))}catch(e){}};
  store={put:async it=>{items.set(it.id,it);persist();render()}, del:async id=>{items.delete(id);persist();render()}, patch:async(id,o)=>{items.set(id,{...items.get(id),...o});persist();render()},
    bulk:async arr=>{arr.forEach(it=>items.set(it.id,it));persist();render()}};
  bannerMsg='modo local: os lançamentos ficam salvos só neste aparelho. veja ajustes para sincronizar.';
  ready=true; render(); autoParcelas();
}
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});
const row=it=>({id:it.id,doc:it,updated_at:new Date().toISOString()});
async function bootNuvem(cfg){
  try{ await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'); }
  catch(e){ bannerMsg='sem internet: não consegui conectar ao banco de dados. tente de novo.'; ready=true; render(); return; }
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const T=()=>sb.from('lancamentos');
  const chk=({error})=>{ if(error) throw error; };
  store={
    put:async it=>{items.set(it.id,it);render();chk(await T().upsert(row(it)));},
    del:async id=>{items.delete(id);render();chk(await T().delete().eq('id',id));},
    patch:async(id,o)=>{const it={...items.get(id),...o};items.set(id,it);render();chk(await T().upsert(row(it)));},
    bulk:async arr=>{for(let i=0;i<arr.length;i+=500) chk(await T().upsert(arr.slice(i,i+500).map(row))); arr.forEach(it=>items.set(it.id,it)); render();},
  };
  const {data}=await sb.auth.getSession(); session=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{ const had=!!session; session=s;
    if(!s){ items.clear(); gate='login'; ready=true; autoDone=false; render(); }
    else if(!had){ setTimeout(afterLogin,0); } });
  if(session) await afterLogin(); else { gate='login'; ready=true; render(); }
}
async function afterLogin(){
  userEmail=session?.user?.email||''; gate=null; ready=false; render();
  const mem=await sb.from('membros').select('email').limit(1);
  if(mem.error||!mem.data?.length){ gate='semacesso'; ready=true; render(); return; }
  const all=[];
  for(let from=0;;from+=1000){ const {data,error}=await sb.from('lancamentos').select('id,doc').range(from,from+999);
    if(error){ bannerMsg='não consegui carregar os lançamentos. recarregue a página.'; break; } all.push(...data); if(data.length<1000) break; }
  items.clear(); all.forEach(r=>items.set(r.id,{...r.doc,id:r.id}));
  if(!channel) channel=sb.channel('lancamentos').on('postgres_changes',{event:'*',schema:'public',table:'lancamentos'},p=>{
    if(p.eventType==='DELETE'){ if(p.old?.id) items.delete(p.old.id); } else if(p.new?.id){ items.set(p.new.id,{...p.new.doc,id:p.new.id}); }
    render(); }).subscribe();
  ready=true; render(); setTimeout(autoParcelas,400);
}
function toast(t,i='check'){const h=$('#toastHost');h.innerHTML=`<div class="toast">${ic(i,'sm')}${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2400);}
async function safe(p,ok){try{await p; if(ok) toast(ok);}catch(e){toast(e?.code==='invalid_argument'||e?.code==='42501'?'você não tem permissão para editar.':'não salvou. confira a internet e tente de novo.','alert');}}

// Installments carry over by themselves: for the current and the next month, every x/y from the month
// before with x<y gets its x+1/y as an unpaid bill. The last one (y/y) does not continue.
async function autoParcelas(){
  if(autoDone||!canWrite||!store) return; autoDone=true;
  const cur=today().slice(0,7); let n=0;
  for(const m of [cur, addM(cur,1)]){
    const prev=addM(m,-1);
    const keys=new Set([...items.values()].filter(i=>i.mes===m&&i.tipo==='conta').map(i=>i.quem+'|'+baseOf(i)));
    for(const c of [...items.values()].filter(i=>i.mes===prev&&i.tipo==='conta'&&!i.removido)){
      const p=parc(c.desc); if(!p||p.x>=p.y) continue;
      const k=c.quem+'|'+baseOf(c); if(keys.has(k)) continue;
      const id=`auto_${m}_${c.quem}_${slug(p.base)}_${p.y}`;
      if(items.has(id)) continue;
      const it={id,tipo:'conta',quem:c.quem,desc:`${p.base} ${p.x+1}/${p.y}`,valor:c.valor,data:c.data?addMd(c.data,1):`${m}-10`,mes:m,pago:false,auto:true};
      if(c.banco!==undefined) it.banco=c.banco;
      items.set(id,it); keys.add(k); n++;
      try{ await store.put(it); }catch(e){}
    }
  }
  if(n){ toast(`${n} parcela${n>1?'s':''} lançada${n>1?'s':''} sozinha${n>1?'s':''}`,'layers'); render(); }
}

function render(){

function ruler(){

let stampN=0;
function stamp(ring,big,small){ const id='sp'+(++stampN);
  return `<div class="stamp" aria-hidden="true"><svg viewBox="0 0 200 200"><defs><path id="${id}" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs><text><textPath href="#${id}">${esc(ring)}</textPath></text></svg><b>${big}<small>${small}</small></b></div>`; }
const tile=(k,n,s,i,cls='',go='')=>`<${go?`button data-page="${go}"`:'div'} class="tile ${cls}"><span class="k">${k}</span><span class="n num">${n}</span><span class="s">${s}</span>${ic(i,'bgi')}</${go?'button':'div'}>`;

function resumo(m){ const E=sum(ofMes(m,'entrada')),C=sum(ofMes(m,'conta')),G=sum(ofMes(m,'gasto')); return {E,C,G,S:E-C-G}; }

function pInicio(){
  const t=today(), cur=ui.mes, now=new Date();
  const h=now.getHours(); const saud=h<12?'bom dia,':h<18?'boa tarde,':'boa noite,';
  const wk=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const contas=ofMes(cur,'conta'); const abertas=contas.filter(c=>!c.pago); const falta=sum(abertas);
  const r=resumo(cur); const pagas=contas.length-abertas.length;
  const pend=[...ofMes(cur,'conta'),...ofMes(addM(cur,-1),'conta')].filter(c=>!c.pago&&c.data&&dDiff(c.data,t)<=7).sort((a,b)=>a.data.localeCompare(b.data));
  const k=v=>v>=1000?(Math.round(v/100)/10).toLocaleString('pt-BR')+'k':String(Math.round(v));
  let html=`<section class="intro"><div><span class="eyebrow">${esc(wk)}</span>
      <h1><span class="script">${saud}</span>laís &amp; igor.</h1>

      ${stamp(`falta pagar · ${mName(cur)} · falta pagar · ${mName(cur)} · `, `<span class="brl">R$</span> ${k(falta)}`, `${abertas.length} conta${abertas.length===1?'':'s'}`)}</section>`;
  html+=`<section class="feature"><span class="tagtop">esta semana</span>
    <div><h2>para <span class="script">pagar</span></h2><p class="sub">${pend.length?`${pend.length} conta${pend.length>1?'s':''} até ${ddmm(new Date(Date.now()+7*864e5).toISOString().slice(0,10))}. toque no círculo quando pagar.`:'nada vencendo nos próximos 7 dias.'}</p>
      ${pend.slice(0,5).map(c=>{const d=dDiff(c.data,t);return `<div class="frow">${canWrite?`<button class="ck" data-pagar="${esc(c.id)}" aria-label="marcar ${esc(c.desc)} como paga">${ic('check','sm')}</button>`:'<span></span>'}
        <span style="min-width:0"><b>${esc(c.desc)}</b><small class="${d<0?'bad':''}">${QUEM[c.quem]} · ${d<0?`atrasada há ${-d} dia${-d>1?'s':''}`:d===0?'vence hoje':`vence em ${d} dia${d>1?'s':''}`}${banco(c)&&banco(c)!=='boleto'?' · '+esc(banco(c)):''}</small></span>
        <span class="fv num">${fmt(c.valor)}</span></div>`}).join('')}
      ${pend.length>5?`<div class="frow" style="grid-template-columns:1fr"><small>e mais ${pend.length-5}…</small></div>`:''}</div>
    <div class="fright"><span class="k">falta pagar em ${mName(cur)}</span>
      <div class="fbig num">${fmt(falta).replace(/<span class="brl">R\$<\/span>\s?/,'<span class="brl">R$</span>')}</div>
      <span style="color:rgba(255,255,255,.7)">de ${fmt(r.C)} · ${pagas} de ${contas.length} pagas</span>
      <div class="fbar"><i style="width:${r.C?(r.C-falta)/r.C*100:0}%"></i></div>
      <button class="btn cream" data-page="contas">ver todas as contas ${ic('arrow','sm')}</button>
      ${canWrite?`<button class="btn ghost-l" data-new="conta">${ic('plus','sm')} nova conta</button>`:''}</div></section>`;
  html+=`<div class="tiles">${tile(`entrou em ${mName(cur)}`,fmt(r.E),`${ofMes(cur,'entrada').length} entrada(s) · ver entradas`,'up','', 'entradas')}
    ${tile('gastos do dia a dia',fmt(r.G),`${ofMes(cur,'gasto').length} lançamento(s) · ver gastos`,'bag','ink','gastos')}
    ${tile(r.S<0?'faltou':'sobrou',fmt(Math.abs(r.S)),r.S<0?'saiu mais do que entrou':'entrou mais do que saiu','target','acc','ano')}</div>`;
  const prox=[...abertas,...ofMes(addM(cur,1),'conta').filter(c=>!c.pago)].filter(c=>c.data&&dDiff(c.data,t)>=0&&dDiff(c.data,t)<=14).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,7);
  html+=`<div class="grid-2"><section class="card"><div class="card-h"><h2>últimos ${window.innerWidth<700?6:12} <span class="script">meses</span></h2><button class="link" data-page="ano">ver ano ${ic('arrow','sm')}</button></div>${chart12(cur)}</section>
    <section class="card"><div class="card-h"><h2>próximos <span class="script">14 dias</span></h2>${ic('cal','sm')}</div>${prox.length?`<div class="tl">${prox.map(c=>{const d=dDiff(c.data,t);const b=banco(c);
      return `<div class="tl-row"><div class="tl-d"><b class="num">${c.data.slice(8)}</b><small>${d===0?'hoje':new Date(c.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</small></div><span class="tl-dot" style="background:var(--${c.quem})"></span>
      <div class="x"><b>${fmt(c.valor)} · ${esc(c.desc)}</b><small>${QUEM[c.quem]}${b&&b!=='boleto'?' · '+esc(b):''}</small></div></div>`}).join('')}</div>`
    :`<div class="empty">${ic('cal')}<div>nada vencendo nos próximos dias.</div></div>`}</section></div>`;
  html+=`<div class="grid-2e">${cardQuem(cur)}${cardCats(ofMes(cur,'gasto'),'para onde foi o dia a dia')}</div>`;
  return html;
}

function chart12(endM){
  const N=window.innerWidth<700?6:12; const ms=[]; for(let i=N-1;i>=0;i--) ms.push(addM(endM,-i));
  const data=ms.map(m=>{const r=resumo(m);return {m,E:r.E,O:r.C+r.G}});
  const W=N===6?420:760,H=N===6?240:270,L=44,R=12,T=16,B=30;
  const mx=Math.max(...data.map(d=>Math.max(d.E,d.O)),1); const st=nice(mx/4); const top=Math.ceil(mx/st)*st;
  const y=v=>T+(H-T-B)*(1-v/top); const bw=(W-L-R)/N;
  const w_=data.filter(d=>d.O>0); const avg=w_.length?w_.reduce((s,d)=>s+d.O,0)/w_.length:0;
  let s=`<rect x="${L+(N-1)*bw}" y="${T-6}" width="${bw}" height="${H-T-B+6}" rx="8" fill="var(--rose-soft)"/>`;
  for(let v=0;v<=top+1e-6;v+=st) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`;
  data.forEach((d,i)=>{const x=L+i*bw; const w=Math.min(18,bw*.3);
    if(d.E) s+=`<rect x="${x+bw/2-w-2}" y="${y(d.E)}" width="${w}" height="${y(0)-y(d.E)}" rx="3" fill="var(--ink)"><title>${mName(d.m)}: entrou ${fmtT(d.E)}</title></rect>`;
    if(d.O) s+=`<rect x="${x+bw/2+2}" y="${y(d.O)}" width="${w}" height="${y(0)-y(d.O)}" rx="3" fill="var(--rose-mid)"><title>${mName(d.m)}: saiu ${fmtT(d.O)}</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" ${i===N-1?'style="fill:var(--ink);font-weight:600"':''}>${mName(d.m).slice(0,3)}${d.m.slice(5)==='01'?' '+d.m.slice(2,4):''}</text>`;});
  if(avg) s+=`<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--rose)" stroke-dasharray="5 5"/><text x="${W-R-2}" y="${y(avg)-6}" text-anchor="end" style="fill:var(--rose)">média de saídas</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="entradas e saídas nos últimos ${N} meses">${s}</svg></div>
    <div class="legend"><span><i class="sw" style="background:var(--ink)"></i>entrou</span><span><i class="sw" style="background:var(--rose-mid)"></i>saiu (contas + gastos)</span></div>`;
}
const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};

function cardQuem(m, list){
  const arr=list||[...ofMes(m,'conta'),...ofMes(m,'gasto')]; const ent=list?[]:ofMes(m,'entrada');
  const q={lais:0,igor:0,juntos:0}; arr.forEach(i=>q[i.quem]=(q[i.quem]||0)+(+i.valor||0)); const mx=Math.max(...Object.values(q),1);
  const e={lais:0,igor:0}; ent.forEach(i=>{if(e[i.quem]!==undefined) e[i.quem]+=+i.valor||0});
  return `<section class="card"><div class="card-h"><h2>quem gastou</h2>${ic('users','sm')}</div><div class="bars">${Object.keys(QUEM).map(k=>`<div class="bar"><span><span class="dot ${k}"></span>${QUEM[k]}</span><span class="num">${fmt(q[k])}</span><div class="trk"><i style="width:${q[k]/mx*100}%;background:var(--${k})"></i></div></div>`).join('')}</div>
    ${list?'':`<div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center;justify-items:end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.86rem"><span class="lbl" style="justify-self:start">quem trouxe</span><span><span class="dot lais"></span> <span class="num">${fmt(e.lais)}</span></span><span><span class="dot igor"></span> <span class="num">${fmt(e.igor)}</span></span></div>`}</section>`;
}
function cardCats(gastos,title){
  const c={}; gastos.forEach(g=>{const k=cat(g);c[k]=(c[k]||0)+(+g.valor||0)}); const a=Object.entries(c).sort((x,y)=>y[1]-x[1]); const mx=a[0]?.[1]||1; const T=sum(gastos)||1;
  return `<section class="card"><div class="card-h"><h2>${title}</h2>${ic('pie','sm')}</div>${a.length?`<div class="bars">${a.slice(0,7).map(([n,v])=>`<button class="bar" data-cat="${esc(n)}"><span>${esc(n)} <span class="muted" style="font-size:.78rem">${Math.round(v/T*100)}%</span></span><span class="num">${fmt(v)}</span><div class="trk"><i style="width:${v/mx*100}%;background:${CATC[n]}"></i></div></button>`).join('')}</div>`:`<div class="empty">${ic('bag')}<div>nenhum gasto lançado.</div></div>`}</section>`;
}

// ---------- contas ----------
function pContas(){
  const t=today(), m=ui.mes; const all=ofMes(m,'conta').sort((a,b)=>(a.data||'9').localeCompare(b.data||'9'));
  const abertas=all.filter(c=>!c.pago), atras=abertas.filter(c=>c.data&&c.data<t);
  const r=sum(all), pago=sum(all.filter(c=>c.pago));
  const parcs=all.filter(c=>{const p=parc(c.desc);return p&&p.y>1}); const falta=parcs.reduce((s,c)=>{const p=parc(c.desc);return s+(p.y-p.x)*(+c.valor||0)},0);
  let html=header('financeiro · contas', `<button class="btn line" data-csv="1">${ic('down','sm')} csv</button>${canWrite?`<button class="btn line" data-copiar="1" title="repete as contas fixas (claro, mrv, mensalidade…) no próximo mês">${ic('repeat','sm')} repetir fixas em ${mName(addM(m,1))}</button><button class="btn dark" data-new="conta">${ic('plus','sm')} conta</button>`:''}`);

  if(atras.length) html+=`<div class="alert bad">${ic('alert')}<span>${atras.length===1?'uma conta está':`${atras.length} contas estão`} atrasada${atras.length>1?'s':''}: <b>${fmt(sum(atras))}</b>.</span></div>`;
  else if(abertas.length) html+=`<div class="alert">${ic('clock')}<span>faltam <b>${fmt(r-pago)}</b> para fechar as contas de ${mName(m)}.</span></div>`;
  else if(all.length) html+=`<div class="alert good">${ic('check')}<span>todas as contas de ${mName(m)} estão pagas.</span></div>`;
  let list=all;
  if(ui.filtro==='aberto') list=list.filter(c=>!c.pago); if(ui.filtro==='pago') list=list.filter(c=>c.pago);
  if(ui.bank) list=list.filter(c=>(banco(c)||'sem')===ui.bank);
  if(ui.quem!=='todos') list=list.filter(c=>c.quem===ui.quem);
  const rows=list.map(c=>{const p=parc(c.desc); const d=c.data?dDiff(c.data,t):null;
    const when=c.pago?['',ddmm(c.data),'paga']:d===null?['','sem data','']:d<0?['bad',ddmm(c.data),`atrasada há ${-d} dia${-d>1?'s':''}`]:d===0?['warn','hoje','vence hoje']:d<=3?['warn',ddmm(c.data),`em ${d} dia${d>1?'s':''}`]:['',ddmm(c.data),`em ${d} dias`];
    return `<div class="tr ${c.pago?'paid':''}"><div class="c1 edit-area" data-edit="${esc(c.id)}"><b>${esc(p?p.base:c.desc)}</b><small><span class="dot ${c.quem}"></span>${QUEM[c.quem]||''}${c.auto?` <span class="tag auto">${ic('repeat','sm')} automática</span>`:''}</small></div>
      <div class="cb">${bankChip(c)}${p?`<span class="tag mob">${ic('layers','sm')} ${p.x} de ${p.y}</span>`:''}</div>
      <div class="cp">${p?`<span class="tag">${ic('layers','sm')} ${p.x} de ${p.y}</span>`:'<span class="muted">—</span>'}</div>
      <div class="when ${when[0]}">${when[1]}<small>${when[2]}</small></div>
      <div class="val num">${fmt(c.valor)}</div>
      <div class="act">${c.pago?`<button class="pill-btn done" data-pagar="${esc(c.id)}" ${canWrite?'':'disabled'}>${ic('check','sm')} pago</button>`:canWrite?`<button class="pill-btn ${when[0]?'rose':''}" data-pagar="${esc(c.id)}">marcar pago</button>`:''}</div></div>`;}).join('');
  html+=`<div class="grid-c"><section class="card"><div class="card-h"><h2>contas</h2>
      <div class="toolbar"><div class="seg">${[['aberto','em aberto'],['todas','todas'],['pago','pagas']].map(([k,l])=>`<button data-filtro="${k}" aria-pressed="${ui.filtro===k}">${l}</button>`).join('')}</div>
      <select class="sel" id="selQuem" aria-label="filtrar por pessoa">${[['todos','todos'],['lais','laís'],['igor','igor'],['juntos','juntos']].map(([k,l])=>`<option value="${k}" ${ui.quem===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
      ${ui.bank?`<div style="margin:-4px 0 10px"><button class="chip" aria-pressed="true" data-bank="">${ic('x','sm')} só ${esc(ui.bank==='sem'?'sem banco':ui.bank==='boleto'?'boleto ou pix':ui.bank)}</button></div>`:''}
      <div class="tbl"><div class="tr head"><span>descrição</span><span>banco / cartão</span><span>parcela</span><span>vencimento</span><span style="text-align:right">valor</span><span style="text-align:right">situação</span></div>

      ${list.length?`<div class="total-row"><span>total ${ui.filtro==='aberto'?'em aberto':ui.filtro==='pago'?'pago':''}</span><span class="num">${fmt(sum(list))}</span></div>`:''}</section>
    ${cardBancos(all)}</div>`;
  if(parcs.length) html+=`<section class="card"><div class="card-h"><h2>parcelas em andamento</h2><span class="muted" style="font-size:.84rem">passam sozinhas para o mês seguinte</span></div><div class="grid-2e" style="gap:14px 28px">${parcs.sort((a,b)=>{const pa=parc(a.desc),pb=parc(b.desc);return (pb.y-pb.x)*b.valor-(pa.y-pa.x)*a.valor}).map(c=>{const p=parc(c.desc);const b=banco(c);
      return `<div class="bar"><span>${b&&b!=='boleto'?bankMark(b):`<span class="dot ${c.quem}"></span>`}${esc(p.base)} <span class="tag">${p.x}/${p.y}</span></span><span class="num muted" style="font-size:.82rem">${p.x<p.y?`faltam ${fmt((p.y-p.x)*c.valor)}`:'última parcela'}</span><div class="trk"><i style="width:${p.x/p.y*100}%;background:var(--${c.quem})"></i></div></div>`}).join('')}</div></section>`;
  return html;
}
function cardBancos(all){
  const g={}; all.forEach(c=>{const b=banco(c)||'sem'; (g[b]=g[b]||[]).push(c)});
  const cards=Object.entries(g).filter(([b])=>b!=='boleto'&&b!=='sem').sort((a,b)=>sum(b[1])-sum(a[1]));
  const cardTot=cards.reduce((s,[,a])=>s+sum(a),0);
  const row=(b,a,mark,name)=>{const ab=a.filter(c=>!c.pago);return `<button class="bk" data-bank="${esc(b)}" aria-pressed="${ui.bank===b}">${mark}<span style="min-width:0"><b>${name}</b><small>${a.length} item(s) · ${ab.length?`falta ${fmt(sum(ab))}`:'tudo pago'}</small></span><span class="r"><b class="num">${fmt(sum(a))}</b><br><small style="color:var(--${ab.length?'muted':'good'})">${ab.length?'a pagar':'paga'}</small></span></button>`};
  return `<section class="card"><div class="card-h"><h2>por banco</h2>${ic('bank','sm')}</div>
    ${cards.length?`<div class="banks">${cards.map(([b,a])=>row(b,a,bankMark(b),esc(b))).join('')}</div><div class="total-row"><span>total em cartões</span><span class="num">${fmt(cardTot)}</span></div>`:`<div class="empty" style="padding:14px">${ic('card')}<div>nenhuma fatura de cartão neste mês.</div></div>`}
    <div class="banks" style="margin-top:12px">${g.boleto?row('boleto',g.boleto,`<span class="bm" style="background:var(--sunk);color:var(--muted)">${ic('file','sm')}</span>`,'boleto ou pix'):''}
    ${g.sem?row('sem',g.sem,`<span class="bm" style="background:var(--rose-soft);color:var(--rose)">${ic('plus','sm')}</span>`,'sem banco definido'):''}</div>
    ${g.sem?`<p class="hint" style="margin-top:8px">toque numa conta para dizer em qual cartão ela está.</p>`:''}</section>`;
}

function pGastos(){

  list=[...list].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const days=new Set(all.map(g=>g.data).filter(Boolean)).size; const T=sum(all);
  const top={}; all.forEach(g=>{const k=cat(g);top[k]=(top[k]||0)+g.valor}); const tc=Object.entries(top).sort((a,b)=>b[1]-a[1])[0];
  const mx=all.reduce((a,g)=>g.valor>(a?.valor||0)?g:a,null);

    rows+=`<button class="li" data-edit="${esc(g.id)}">${avatar(g.quem)}<span style="min-width:0"><b>${esc(g.desc)}</b><small>${QUEM[g.quem]} · <span style="color:${CATC[cat(g)]}">${esc(cat(g))}</span></small></span><span class="v num">${fmt(g.valor)}</span></button>`; }
  html+=`<div class="grid-2"><section class="card"><div class="card-h"><h2>gastos</h2><label class="search">${ic('search','sm')}<input id="busca" type="search" placeholder="buscar gasto…" value="${esc(ui.q)}" aria-label="buscar gasto"></label></div>
    <div class="chips" style="margin-bottom:6px">${['todos','lais','igor','juntos'].map(k=>`<button class="chip" data-quem="${k}" aria-pressed="${ui.quem===k}">${k==='todos'?'todos':`<span class="dot ${k}"></span>${QUEM[k]}`}</button>`).join('')}${ui.cat?`<button class="chip" aria-pressed="true" data-cat="">${ic('x','sm')} ${esc(ui.cat)}</button>`:''}</div>

// ---------- ano ----------

    <div class="ph-r"><div class="seg">${years.map(y=>`<button data-ano="${y}" aria-pressed="${y===Y}">${y}</button>`).join('')}</div></div></div>`;
  html+=`<div class="stats">${stat('entrou no ano',fmt(E),`${rows.length} meses registrados`,'up')}${stat('contas',fmt(C),`média de ${fmt(C/(rows.length||1))} por mês`,'file')}${stat('gastos do dia a dia',fmt(G),`média de ${fmt(G/(rows.length||1))} por mês`,'bag')}${stat('saldo do ano',`<span style="color:var(--${E-C-G<0?'bad':'good'})">${fmt(E-C-G)}</span>`,'entradas menos saídas','target')}</div>`;
  html+=`<section class="card"><div class="card-h"><h2>mês a mês</h2><span class="muted" style="font-size:.84rem">toque num mês para abrir as contas</span></div><div class="chart"><table class="yr num"><thead><tr><th>mês</th><th>entrou</th><th>contas</th><th>gastos</th><th>sobrou</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.m===today().slice(0,7)?'cur':''}"><td><button class="link" style="color:var(--ink)" data-goto="${r.m}">${r.n}</button></td><td>${fmt(r.E)}</td><td>${fmt(r.C)}</td><td>${fmt(r.G)}</td><td style="font-weight:600;color:var(--${r.S<0?'bad':'good'})">${fmt(r.S)}</td></tr>`).join('')}
    <tr class="tot"><td>total</td><td>${fmt(E)}</td><td>${fmt(C)}</td><td>${fmt(G)}</td><td style="color:var(--${E-C-G<0?'bad':'good'})">${fmt(E-C-G)}</td></tr></tbody></table></div></section>`;
  html+=`<div class="grid-2e">${cardQuem(null,yr.filter(i=>i.tipo!=='entrada'))}${cardCats(yr.filter(i=>i.tipo==='gasto'),'dia a dia por categoria')}</div>`;
  html+=`<section class="card"><div class="card-h"><h2>cartões no ano</h2>${ic('card','sm')}</div>${ba.length?`<div class="bars">${ba.map(([b,v])=>`<div class="bar"><span>${bankMark(b)}${esc(b)}</span><span class="num">${fmt(v)}</span><div class="trk"><i style="width:${v/bmx*100}%;background:${(BK()[b]||BANKS['outro cartão']).c}"></i></div></div>`).join('')}</div>`:'<div class="empty">nenhuma fatura de cartão no ano.</div>'}</section>`;
  return html;
}

async function saveFile(name,data,type){
  try{ const dl=window.claude?.use? await window.claude.use('downloads'):null; if(dl){ await dl.save({filename:name,data}); return; } }catch(e){ if(e?.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('não consegui gerar o arquivo.','alert'); }
}
function exportJson(){ saveFile(`financeiro-backup-${today()}.json`, JSON.stringify({app:'financeiro',versao:1,exportado:new Date().toISOString(),itens:[...items.values()].filter(i=>!i.removido)}), 'application/json'); }
async function readImport(file){
  try{ const j=JSON.parse(await file.text()); const arr=(Array.isArray(j)?j:j.itens||[]).filter(i=>i&&i.id&&i.tipo&&(i.mes||i.tipo==='banco'));
    if(!arr.length){ toast('esse arquivo não tem lançamentos.','alert'); return; } importPend=arr; render();
  }catch(e){ toast('não consegui ler esse arquivo.','alert'); }
}
async function doImport(){
  const arr=importPend; importPend=null; render(); toast(`importando ${arr.length} lançamentos…`,'upload');
  try{ if(store.bulk) await store.bulk(arr); else for(const it of arr) await store.put(it); toast(`${arr.length} lançamentos importados`); autoDone=false; autoParcelas(); }
  catch(e){ toast('a importação parou no meio. tente de novo.','alert'); }
}
async function doLogin(){
  const email=$('#l-email').value.trim(), pass=$('#l-pass').value; const err=t=>{const e=$('#l-err');e.textContent=t;e.hidden=false};
  if(!email||!pass) return err('preencha email e senha.');
  if(signup&&pass.length<6) return err('a senha precisa ter pelo menos 6 caracteres.');
  const btn=$('#loginF button[type=submit]'); btn.disabled=true;
  const r=signup? await sb.auth.signUp({email,password:pass}) : await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;
  if(r.error){ const m=r.error.message||''; return err(/invalid login/i.test(m)?'email ou senha incorretos.':/not confirmed/i.test(m)?'confirme o email que enviamos e depois entre aqui.':/already registered/i.test(m)?'esse email já tem senha. toque em entrar.':'não deu certo: '+m.toLowerCase()); }
  if(signup&&!r.data.session){ signup=false; render(); toast('enviamos um email de confirmação. depois é só entrar.','alert'); }
}

  form=it?{...it,novo:false}:{id:uid(),novo:true,tipo:tp,quem:tp==='entrada'?'lais':'juntos',desc:'',valor:'',data:cur===t.slice(0,7)?t:`${cur}-${tp==='conta'?'10':'01'}`,pago:false,rep:1};

}

function readForm(){ const f=form; f.valor=$('#f-valor').value; f.desc=$('#f-desc').value; f.data=$('#f-data').value;
  if($('#f-cat')) f.cat=$('#f-cat').value; if($('#f-rep')) f.rep=+$('#f-rep').value; if($('#f-pago')) f.pago=$('#f-pago').value==='1';
  if($('#f-bank')) f.bankSel=$('#f-bank').value; }
const parseV=s=>{s=String(s).trim().replace(/[R$\s]/gi,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:NaN};
async function submit(){
  readForm(); const f=form; const v=parseV(f.valor); const err=t=>{const e=$('#f-err');e.textContent=t;e.hidden=false};
  if(f.valor===''||!(v>=0)) return err('digite o valor, por exemplo 45,90.');
  if(!f.desc.trim()) return err('escreva uma descrição curta, por exemplo mercado.');
  const o={tipo:f.tipo,quem:f.tipo==='entrada'&&f.quem==='juntos'?'lais':f.quem,desc:f.desc.trim(),valor:v,data:f.data||null,mes:(f.data||ui.mes).slice(0,7)};
  if(f.tipo==='gasto'&&f.cat&&f.cat!==cat({desc:o.desc})) o.cat=f.cat;
  if(f.tipo==='conta'){ o.pago=!!f.pago; const auto=banco({...o})||''; const sel=f.bankSel??auto; if(sel!==auto) o.banco=sel==='boleto'?'':sel; else if(!f.novo&&f.banco!==undefined) o.banco=f.banco; if(!f.novo&&f.auto) o.auto=true; }
  const n=f.novo&&f.tipo==='conta'?(f.rep||1):1; form=null; drawSheet();
  if(n>1){ const d0=o.data||o.mes+'-10'; for(let i=0;i<n;i++){const dt=addMd(d0,i); await safe(store.put({...o,id:uid(),desc:`${o.desc} ${i+1}/${n}`,data:dt,mes:dt.slice(0,7),pago:i===0?o.pago:false}));} toast(`${n} parcelas lançadas`,'layers'); }
  else await safe(store.put({...o,id:f.id}), f.novo?'lançado':'alterado');
}
async function repetirFixas(){
  const m=ui.mes, nx=addM(m,1); const ex=new Set(ofMes(nx,'conta').map(c=>c.quem+'|'+baseOf(c))); let n=0;
  for(const c of ofMes(m,'conta')){ if(parc(c.desc)) continue; const k=c.quem+'|'+baseOf(c); if(ex.has(k)) continue;
    const it={id:uid(),tipo:'conta',quem:c.quem,desc:c.desc,valor:c.valor,data:c.data?addMd(c.data,1):`${nx}-10`,mes:nx,pago:false}; if(c.banco!==undefined) it.banco=c.banco;
    await safe(store.put(it)); n++; }
  toast(n?`${n} conta${n>1?'s fixas repetidas':' fixa repetida'} em ${mName(nx)}`:`${mName(nx)} já tem essas contas`, n?'repeat':'check');
}
async function exportCsv(){
  const rows=[['tipo','mes','data','quem','descricao','categoria','banco','valor','pago']].concat(ofMes(ui.mes).map(i=>[i.tipo,i.mes,i.data||'',QUEM[i.quem]||i.quem,i.desc,i.tipo==='gasto'?cat(i):'',i.tipo==='conta'?(banco(i)||''):'',String(i.valor).replace('.',','),i.tipo==='conta'?(i.pago?'sim':'não'):'']));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'); const name=`financeiro-${ui.mes}.csv`;
  try{ const dl=window.claude?.use? await window.claude.use('downloads'):null; if(dl){ await dl.save({filename:name,data:csv}); return; } }catch(e){ if(e?.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click(); }catch(e){ toast('não consegui gerar o arquivo.','alert'); }
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-bankadd],[data-bankdel],[data-setmes],[data-tema],[data-signup],[data-sair],[data-export],[data-impok],[data-impcancel],[data-page],[data-mstep],[data-pagar],[data-edit],[data-new],[data-filtro],[data-bank],[data-quem],[data-cat],[data-ano],[data-goto],[data-copiar],[data-csv],[data-close],[data-ft],[data-fq],[data-askdel],[data-del]');
  if(!t) return;
  const d=t.dataset;
  if(d.bankadd){ const n=($('#bk-nome').value||'').trim().toLowerCase(); if(!n){ toast('escreva o nome do banco.','alert'); return; }
    safe(store.put({id:'banco_'+slug(n),tipo:'banco',nome:n,cor:$('#bk-cor').value}),`${n} adicionado`); return; }
  if(d.bankdel){ const id='banco_'+slug(d.bankdel); if(items.has(id)) safe(store.del(id),'banco removido'); return; }
  if(d.setmes){ ui.mes=d.setmes; ui.bank=null; render(); return; }
  if(d.tema){ const t=TEMAS.find(x=>x[0]===d.tema); if(t){ setTema({id:t[0],...t[2]}); toast('cor salva neste aparelho'); } return; }
  if(d.signup){ signup=!signup; render(); return; }
  if(d.sair){ sb?.auth.signOut(); return; }
  if(d.export){ exportJson(); return; }
  if(d.impok){ doImport(); return; }
  if(d.impcancel){ importPend=null; render(); return; }
  if(d.close!==undefined){ if(e.target===t||t.tagName==='BUTTON'){form=null;drawSheet();} return; }
  if(d.page){ ui.page=d.page; ui.cat=null; ui.bank=null; ui.q=''; ui.quem='todos'; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(d.mstep){ ui.mes=addM(ui.mes,+d.mstep); ui.bank=null; render(); return; }
  if(d.goto){ ui.mes=d.goto; ui.page='contas'; saveUi(); render(); window.scrollTo({top:0}); return; }
  if(d.pagar){ if(!canWrite) return; const it=items.get(d.pagar); if(it) safe(store.patch(it.id,{pago:!it.pago}), it.pago?'voltou para a pagar':'conta paga'); return; }
  if(d.edit){ if(!canWrite) return; const it=items.get(d.edit); if(it) openSheet(it); return; }
  if(d.new){ openSheet(null,d.new==='auto'?null:d.new); return; }
  if(d.filtro){ ui.filtro=d.filtro; render(); return; }
  if(d.bank!==undefined){ ui.bank=d.bank&&ui.bank!==d.bank?d.bank:null; render(); return; }
  if(d.quem){ ui.quem=d.quem; render(); return; }
  if(d.cat!==undefined){ ui.cat=d.cat||null; if(d.cat&&ui.page!=='gastos'){ui.page='gastos';saveUi();window.scrollTo({top:0});} render(); return; }
  if(d.ano){ ui.ano=d.ano; render(); return; }
  if(d.copiar){ repetirFixas(); return; }
  if(d.csv){ exportCsv(); return; }
  if(d.ft){ readForm(); form.tipo=d.ft; if(form.tipo==='entrada'&&form.quem==='juntos') form.quem='lais'; drawSheet(); return; }
  if(d.fq){ readForm(); form.quem=d.fq; drawSheet(); return; }
  if(d.askdel){ readForm(); form.confirm=true; drawSheet(); return; }
  if(d.del){ const id=form.id, auto=form.auto; form=null; drawSheet(); safe(auto?store.patch(id,{removido:true}):store.del(id),'excluído'); return; }
});
document.addEventListener('change',e=>{ if(e.target.dataset?.bankcor){ const n=e.target.dataset.bankcor; const id='banco_'+slug(n); safe(store.put({...(items.get(id)||{}),id,tipo:'banco',nome:n,cor:e.target.value}),'cor do banco salva'); return; } if(e.target.id==='selQuem'){ui.quem=e.target.value;render();} if(e.target.id==='impFile'&&e.target.files[0]) readImport(e.target.files[0]); if(e.target.id==='temaCor'){ setTema(temaCustom(e.target.value)); toast('cor salva neste aparelho'); } });
document.addEventListener('submit',e=>{ if(e.target.id==='sheet'){e.preventDefault();submit();} if(e.target.id==='loginF'){e.preventDefault();doLogin();} });
document.addEventListener('input',e=>{
  if(e.target.id==='temaCor'){ applyTema(temaCustom(e.target.value)); return; }
  if(e.target.id==='bk-cor'){ $('#bk-sw').style.background=e.target.value; return; }
  if(e.target.id==='busca'){ ui.q=e.target.value; const p=e.target.selectionStart; render(); const b=$('#busca'); b.focus(); try{b.setSelectionRange(p,p)}catch(_){} }
  if(e.target.id==='f-desc'){ if($('#f-cat')) $('#f-cat').value=cat({desc:e.target.value}); if($('#f-bank')&&form&&form.bankSel===undefined&&form.banco===undefined){ const b=banco({tipo:'conta',desc:e.target.value}); $('#f-bank').value=b||''; } }
});
let rz; let lastW=window.innerWidth; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if((lastW<700)!==(window.innerWidth<700)){lastW=window.innerWidth;render();}},200)});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&form){form=null;drawSheet();} });

boot();
})();
</script>
